        clientID:
          type: string
          description: 'Client ID do OAuth da API do banco.'
        clientSecret:
          type: string
          description: 'Client secret do OAuth da API do banco. Não é persistido.'
        keyUser:
          type: string
          description: 'Chave do usuário na API do banco.'
        scope:
          type: string
          description: 'Escopo do OAuth da API do banco.'
        indicadorPix:
          type: string
          description: 'Indica se o boleto sai com PIX.'
        certCRT:
          type: string
          description: 'base64 do.crt (mTLS).'
        certKEY:
          type: string
          description: 'base64 do.key (mTLS).'
