          description: 'Campos exclusivos ABRASF (municípios fora do Padrão Nacional): opcionais, ignorados na emissão Padrão Nacional. Onde houver equivalente PN (cServ, cTribMun, pAliq em valores), o builder ABRASF cai nele como fallback.'
        responsavelRetencao:
          type: integer
          description: 'Responsável pela retenção do ISSQN.'
        naturezaOperacao:
          type: integer
          description: 'ABRASF v1.'
    NfseTotTrib:
      type: object
      description: 'Os totais aproximados de tributos.'
      properties:
        indTotTrib:
          type: integer
          description: 'Indica se os totais de tributos são informados.'
        pTotTribSN:
          type: number
          description: 'Percentual total de tributos do Simples Nacional.'
        vTotTribFed:
          type: number
          description: 'Valor total dos tributos federais.'
        vTotTribEst:
          type: number
          description: 'Valor total dos tributos estaduais.'
        vTotTribMun:
          type: number
          description: 'Valor total dos tributos municipais.'
        pTotTribFed:
          type: number
          description: 'Percentual total dos tributos federais.'
        pTotTribEst:
          type: number
          description: 'Percentual total dos tributos estaduais.'
        pTotTribMun:
          type: number
          description: 'Percentual total dos tributos municipais.'
    NfseTribFed:
      type: object
      description: 'A tributação federal: PIS/COFINS + retenções.'
      properties:
        CST:
          type: string
          description: 'Código de Situação Tributária.'
        vBCPisCofins:
          type: number
          description: 'Base de cálculo do PIS e da COFINS.'
        pAliqPis:
          type: number
          description: 'Alíquota do PIS, em percentual.'
        pAliqCofins:
          type: number
          description: 'Alíquota da COFINS, em percentual.'
        vPis:
          type: number
          description: 'Valor do PIS.'
        vCofins:
          type: number
          description: 'Valor da COFINS.'
        tpRetPisCofins:
          type: integer
          description: 'Tipo de retenção do PIS e da COFINS.'
        vRetCP:
          type: number
          description: 'Valor retido de contribuição previdenciária.'
        vRetIRRF:
          type: number
          description: 'Valor retido de imposto de renda na fonte.'
        vRetCSLL:
          type: number
          description: 'Valor retido de CSLL.'
    NfseTribMun:
      type: object
      description: 'A tributação municipal.'
      properties:
        tribISSQN:
          type: integer
          enum: [1, 2, 3, 4]
          description: '. Valores: 1 = Operação tributável; 2 = Exportação de serviço; 3 = Não incidência; 4 = Imunidade.'
        tpRetISSQN:
          type: integer
          enum: [1, 2, 3]
          description: 'Valores: 1 = Não retido; 2 = Retido pelo tomador; 3 = Retido pelo intermediário.'
        pAliq:
          type: number
          description: 'alíquota (%).'
        tpImunidade:
          type: integer
          description: 'tipo de imunidade.'
        tpSusp:
          type: integer
          description: 'exigibilidade suspensa.'
        nProcesso:
          type: string
          description: 'processo de suspensão.'
        vRedBCBM:
          type: number
          description: 'redução da BC (benefício).'
        pRedBCBM:
          type: number
          description: 'Percentual de redução da base de cálculo do benefício municipal.'
        nBM:
          type: string
          description: 'nº do benefício municipal.'
    NfseValores:
      type: object
      description: 'Os montantes e a tributação do serviço (ISSQN + federal + totais).'
      properties:
        vServ:
          type: number
          description: 'valor dos serviços.'
        vReceb:
          type: number
          description: 'valor recebido.'
        vDescIncond:
          type: number
          description: 'desconto incondicionado.'
        vDescCond:
          type: number
          description: 'desconto condicionado.'
        vDeducoes:
          type: number
          description: 'valor das deduções.'
        pDeducoes:
          type: number
          description: 'alíquota de deduções (%).'
        tribISSQN:
          type: integer
          enum: [1, 2, 3, 4]
          description: 'ISSQN (atalhos comuns; o detalhe vai em tribMun). Valores: 1 = Operação tributável; 2 = Exportação de serviço; 3 = Não incidência; 4 = Imunidade.'
        pAliq:
          type: number
          description: 'alíquota ISS (%).'
        iss_retido:
          type: integer
          enum: [1, 2]
          description: 'default 2. Valores: 1 = Retido pelo tomador; 2 = Não retido.'
        tribMun:
          description: 'Tributação detalhada (Padrão Nacional).'
          allOf:
            - $ref: "#/components/schemas/NfseTribMun"
        tribFed:
          allOf:
            - $ref: "#/components/schemas/NfseTribFed"
        totTrib:
          allOf:
            - $ref: "#/components/schemas/NfseTotTrib"
    # <<< FIM DOS SCHEMAS GERADOS
    Erro:
      type: object
      description: "Envelope de erro. Trate pelo campo codigo, nunca pela mensagem."
      properties:
        erro:
          type: object
          description: "Detalhe do erro."
          properties:
            codigo:
              type: string
              description: |
                Chave estável para tratar por máquina: `json_invalido`,
                `campo_obrigatorio`, `certificado_invalido`, `chave_invalida`,
                `ambiente_invalido`, `ambiente_divergente`,
                `modal_nao_suportado`, `grupo_incompativel`, `limite_de_requisicoes`,
                `regras_de_negocio`,
                `provedor_nao_suportado`, `operacao_nao_suportada`,
                `desfecho_indeterminado`, `lib_indisponivel`, `falha_na_lib`.
            mensagem:
              type: string
              description: Texto legível do erro. Para tratar por máquina, use o codigo.
            detalhes:
              description: >-
                Contexto do erro, quando existe: a lista de rejeições, o XML
                montado, ou o retorno cru da biblioteca fiscal.

  responses:
    StatusOK:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, example: ok, description: "Sempre ok." }

    RespostaCrua:
      description: |
        Retorno da lib sem reinterpretação: o formato varia por provedor, e
        normalizá-lo esconderia informação que só o provedor tem.
      content:
        application/json:
          schema:
            type: object
            properties:
              codigo: { type: integer, description: "Código de retorno da biblioteca fiscal. 0 é sucesso." }
              resposta: { type: string, description: "Retorno cru, no formato que o provedor devolveu." }
              xml_b64: { type: string, format: byte, description: "XML da resposta, em base64, quando a operação produz um." }

    RespostaPDF:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              pdf_b64: { type: string, format: byte, description: "PDF da representação gráfica, em base64." }

    Erro400:
      description: Pedido inválido
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
    "Erro404":
      description: Rota ou tipo inexistente
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
    Erro422:
      description: Recusado antes de transmitir (nada saiu)
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
    Erro502:
      description: |
        A lib ou o webservice falhou. `desfecho_indeterminado` significa que a
        operação PODE ter sido transmitida: consulte pela chave, não repita.
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
    Erro503:
      description: Motor fiscal indisponível. A chamada NÃO saiu, repetir é seguro
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
