      properties:
        vDevTrib:
          type: number
    CteDif:
      type: object
      description: 'Diferimento do ICMS.'
      properties:
        pDif:
          type: number
        vDif:
          type: number
    CteDocAnt:
      type: object
      description: 'Documentos de transporte anteriores.'
      properties:
        emiDocAnt:
          type: array
          items:
            $ref: "#/components/schemas/CteEmiDocAnt"
    CteDocumento:
