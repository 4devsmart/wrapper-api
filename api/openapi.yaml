          allOf:
            - $ref: "#/components/schemas/CteInfCteSimp"
        infCTeSupl:
          allOf:
            - $ref: "#/components/schemas/CteInfCTeSupl"
        ambiente:
          type: string
          description: 'Ambiente do documento. Vazio assume homologação.'
        referencia:
          type: string
          description: 'Identificador externo seu. Devolvido como veio, não vai no XML.'
    CteDup:
      type: object
      description: 'Duplicata.'
      properties:
        nDup:
          type: string
        dVenc:
          type: string
          format: date
          description: 'Data no formato AAAA-MM-DD. Também aceita DD/MM/AAAA e RFC 3339, caso em que a hora é descartada.'
        vDup:
          type: number
