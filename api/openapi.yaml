        correcoes:
          type: array
          items:
            $ref: "#/components/schemas/CteCorrecao"
          description: 'Grupos a corrigir. Um por campo alterado.'
        nSeqEvento:
          type: integer
          description: 'opcional (default 1).'
    CteEventoComprovanteEntrega:
      type: object
      description: 'O corpo de POST /v1/cte/eventos/comprovante-entrega (tpEvento 110180). Registra a entrega da carga (com geolocalização opcional) e as NF-e entregues.'
      properties:
        nProt:
          type: string
          description: 'Número do protocolo de autorização.'
        UF:
          type: string
          description: 'Sigla da unidade federativa, duas letras.'
        dhEntrega:
          type: string
          format: date-time
          description: 'Data e hora. COM offset (2026-08-23T14:05:00-03:00) a entrada é um instante e é convertida para o fuso do documento; SEM offset (2026-08-23T14:05:00) é lida como relógio de parede do emitente e não sofre conversão. Vazio usa o momento da chamada.'
        nDoc:
          type: string
          description: 'Número do documento.'
        xNome:
          type: string
          description: 'Razão social ou nome.'
        latitude:
          type: number
          description: 'Latitude em graus decimais. Ex.: -23.5505.'
        longitude:
          type: number
          description: 'Longitude em graus decimais. Ex.: -46.6333.'
        hashEntrega:
          type: string
          description: 'Hash SHA-1 do comprovante de entrega, em base64.'
        dhHashEntrega:
          type: string
          format: date-time
          description: 'Data e hora. COM offset (2026-08-23T14:05:00-03:00) a entrada é um instante e é convertida para o fuso do documento; SEM offset (2026-08-23T14:05:00) é lida como relógio de parede do emitente e não sofre conversão. Vazio usa o momento da chamada.'
        documentos:
          type: array
          items:
            type: string
          description: 'chaves de NF-e entregues.'
        nSeqEvento:
          type: integer
          description: 'Número sequencial do evento para a mesma chave. Começa em 1.'
    CteEventoEPEC:
      type: object
