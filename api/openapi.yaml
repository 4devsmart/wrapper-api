          type: string
          description: 'Sigla da UF de início da prestação.'
        UFFim:
          type: string
          description: 'Sigla da UF de fim da prestação.'
        dhEmi:
          type: string
          format: date-time
          description: 'Data e hora. COM offset (2026-08-23T14:05:00-03:00) a entrada é um instante e é convertida para o fuso do documento; SEM offset (2026-08-23T14:05:00) é lida como relógio de parede do emitente e não sofre conversão. Vazio usa o momento da chamada.'
        tomador:
          allOf:
            - $ref: "#/components/schemas/CteTomadorEPEC"
        nSeqEvento:
          type: integer
          description: 'Número sequencial do evento para a mesma chave. Começa em 1.'
    CteEventoInsucessoEntrega:
      type: object
      description: 'O corpo de POST /v1/cte/eventos/insucesso-entrega (tpEvento 110190). Registra a tentativa frustrada de entrega.'
      properties:
        nProt:
          type: string
          description: 'Número do protocolo de autorização.'
        dhTentativaEntrega:
          type: string
          format: date-time
          description: 'Data e hora. COM offset (2026-08-23T14:05:00-03:00) a entrada é um instante e é convertida para o fuso do documento; SEM offset (2026-08-23T14:05:00) é lida como relógio de parede do emitente e não sofre conversão. Vazio usa o momento da chamada.'
