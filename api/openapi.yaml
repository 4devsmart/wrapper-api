        vRec:
          type: number
          description: 'Valor a receber pela prestação.'
        comp:
          type: array
          items:
            $ref: "#/components/schemas/CteComp"
        infNFe:
          type: array
          items:
            $ref: "#/components/schemas/CteInfNFe"
          description: 'Notas fiscais eletrônicas vinculadas ao documento.'
        infDocAnt:
          type: array
          items:
            $ref: "#/components/schemas/CteDetDocAnt"
