    BoletoContaWS:
      type: object
      description: 'As credenciais de integração online com a API do banco: OAuth (ClientID/Secret/Scope) + certificado mTLS (CRT/KEY em base64). Como o certificado A1 dos documentos fiscais, elas viajam no payload e não são persistidas. Os métodos String/LogValue abaixo existem para que um %v ou um slog distraído não as despeje em log: num serviço sem estado, é a única forma realista de um segredo do cliente escapar do processo.'
      properties:
        ambiente:
          type: integer
          enum: [1, 2]
