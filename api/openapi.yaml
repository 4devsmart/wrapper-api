    NfseDocumento:
      type: object
      description: 'O corpo de emissão. NÃO existe campo para escolher o provedor. Quem o decide é o município (infDPS.cLocEmi, ou o cMun do prestador): a biblioteca fiscal resolve o provedor lendo a própria tabela a partir do CodigoMunicipio, e não aceita override. Testado contra a lib: a biblioteca fiscal com a chave "Provedor" falha em todas as formas (PadraoNacional, proPadraoNacional). Para saber quem atende um município antes de montar, use GET /v1/nfse/municipios/{codigo}.'
