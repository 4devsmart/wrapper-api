          type: integer
          enum: [0, 1, 3]
          description: 'TpCTe não tem mais o valor 2 (Anulação): o CT-e de Anulação saiu do layout na versão 4.00, e o ACBr só gera o grupo infCteAnu para VersaoDF <= 3.00 (pcteCTeW.pas:3309). Quem vem da 3.00 usa o CT-e Substituto (valor 3). Valores: 0 = Normal; 1 = Complemento de valores; 3 = Substituto.'
