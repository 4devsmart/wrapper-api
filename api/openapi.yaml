        ambiente:
          type: string
          enum: ["homologacao", "producao"]
          description: 'Ambiente de autorização. Omitir assume homologação; qualquer outro valor é recusado com 400. Valores: homologacao = Ambiente de homologação, sem valor fiscal; producao = Ambiente de produção.'
