      responses:
        "200":
          description: Evento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422":
          description: Evento rejeitado, ou operação não suportada pelo provedor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
  /v1/mdfe/eventos/cancelamento:
    post:
      tags: [mdfe]
      summary: "Evento: cancelamento"
      description: |
        Cancela o MDF-e. Exige o protocolo da autorização.

        Chamada única: a lib não expõe o XML do evento antes de enviá-lo. A
        recuperação é consultar o documento: a chave dele você já tem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoEvento"
                - type: object
                  properties:
                    evento: { $ref: "#/components/schemas/MdfeEventoCancelamento" }
      responses:
        "200":
          description: Evento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422":
          description: Evento rejeitado, ou operação não suportada pelo provedor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
  /v1/mdfe/eventos/inclusao-condutor:
    post:
      tags: [mdfe]
      summary: "Evento: inclusao-condutor"
      description: |
        Inclui condutor no manifesto em trânsito.

        Chamada única: a lib não expõe o XML do evento antes de enviá-lo. A
        recuperação é consultar o documento: a chave dele você já tem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoEvento"
                - type: object
                  properties:
                    evento: { $ref: "#/components/schemas/MdfeEventoInclusaoCondutor" }
      responses:
        "200":
          description: Evento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422":
          description: Evento rejeitado, ou operação não suportada pelo provedor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
  /v1/mdfe/eventos/inclusao-dfe:
    post:
      tags: [mdfe]
      summary: "Evento: inclusao-dfe"
      description: |
        Inclui documentos (NF-e) no manifesto em trânsito.

        Chamada única: a lib não expõe o XML do evento antes de enviá-lo. A
        recuperação é consultar o documento: a chave dele você já tem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoEvento"
                - type: object
                  properties:
                    evento: { $ref: "#/components/schemas/MdfeEventoInclusaoDFe" }
      responses:
        "200":
          description: Evento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422":
          description: Evento rejeitado, ou operação não suportada pelo provedor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
  /v1/mdfe/eventos/pagamento-operacao:
    post:
      tags: [mdfe]
      summary: "Evento: pagamento-operacao"
      description: |
        Registra o pagamento da operação de transporte.

        Chamada única: a lib não expõe o XML do evento antes de enviá-lo. A
        recuperação é consultar o documento: a chave dele você já tem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoEvento"
                - type: object
                  properties:
                    evento: { $ref: "#/components/schemas/MdfeEventoPagamentoOperacao" }
      responses:
        "200":
          description: Evento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422":
          description: Evento rejeitado, ou operação não suportada pelo provedor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
  /v1/mdfe/consulta:
    post:
      tags: [mdfe]
      summary: Consulta o MDF-e pela chave
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoConsultaChave" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaTransmissao" }

  /v1/mdfe/status-servico:
    post:
      tags: [mdfe]
      summary: Status do serviço da SEFAZ
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoSefaz" }
      responses:
        "200": { $ref: "#/components/responses/RespostaCrua" }

  /v1/mdfe/nao-encerrados:
    post:
      tags: [mdfe]
      summary: Lista os MDF-e do CNPJ ainda em trânsito
      description: |
        Conformidade: emitir novo manifesto com outro em aberto é rejeição.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoSefaz"
                - type: object
                  required: [cnpj]
      responses:
        "200": { $ref: "#/components/responses/RespostaCrua" }
        "400": { $ref: "#/components/responses/Erro400" }

  /v1/mdfe/pdf:
    post:
      tags: [mdfe]
      summary: Gera o DAMDFE a partir do XML
      description: |
        Como no CT-e, **não existe "obter PDF pela chave"**. Guarde o XML.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoPDF" }
      responses:
        "200": { $ref: "#/components/responses/RespostaPDF" }

  /v1/mdfe/pdf/evento:
    post:
      tags: [mdfe]
      summary: Gera o DAMDFE de um evento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoPDF"
                - type: object
                  required: [xml_evento_b64]
                  properties:
                    xml_evento_b64: { type: string, format: byte, description: "XML do evento autorizado, em base64. É o que a resposta do evento devolveu." }
      responses:
        "200": { $ref: "#/components/responses/RespostaPDF" }

  # ---------------------------------------------------------------- NFS-e
  /v1/nfse/xml:
    post:
      tags: [nfse]
      summary: Gera o XML da DPS
      description: |
        O município (`infDPS.cLocEmi`, ou o do prestador) decide o provedor, e o
        provedor decide o layout. Município sem provedor conhecido é recusado
        **antes** de montar.

        Devolve `id_dps`, não `chave`: a chave de acesso só existe depois da
        autorização, enquanto o identificador da DPS é determinístico. É ele que
        recupera a transmissão perdida.

        `validacao.suportada` vem **false**: a biblioteca fiscal não expõe
        validação de regras de negócio para NFS-e, ao contrário de CT-e e MDF-e.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NfseDocumento" }
      responses:
        "200":
          description: DPS montada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaXMLNFSe" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422": { $ref: "#/components/responses/Erro422" }

  /v1/nfse/transmissao:
    post:
      tags: [nfse]
      summary: Transmite a DPS ao provedor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoTransmissaoNFSe" }
      responses:
        "200":
          description: Autorizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaTransmissaoNFSe" }
        "422":
          description: Rejeitada, ou operação não suportada pelo provedor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaTransmissaoNFSe" }
        "502": { $ref: "#/components/responses/Erro502" }

  /v1/nfse/consulta-dps:
    post:
      tags: [nfse]
      summary: A DPS virou nota? (recuperação)
      description: |
        É o fecho do modelo sem estado para a NFS-e: depois de um desfecho
        indeterminado, é ISTO que se chama: nunca reenviar a DPS.

        Aceita o `id_dps` como a geração devolveu (com o prefixo `DPS`) ou a
        chave nua; o webservice quer sem prefixo, e essa diferença não é
        problema seu.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoConsultaNFSe" }
      responses:
        "200": { $ref: "#/components/responses/RespostaCrua" }
        "400": { $ref: "#/components/responses/Erro400" }

  /v1/nfse/consulta:
    post:
      tags: [nfse]
      summary: Consulta a NFS-e pela chave
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoConsultaNFSe" }
      responses:
        "200": { $ref: "#/components/responses/RespostaCrua" }

  /v1/nfse/consultas/{tipo}:
    post:
      tags: [nfse]
      summary: Consultas por número, faixa, RPS, situação ou lote
      parameters:
        - name: tipo
          in: path
          required: true
          description: >-
            Qual consulta fazer. Cada uma exige campos diferentes no corpo:
            numero e faixa usam numero/numero_final, rps usa numero/serie/tipo,
            situacao e lote-rps usam protocolo/numero_lote.
          schema: { type: string, enum: [numero, faixa, rps, situacao, lote-rps] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoConsultaNFSe"
                - type: object
                  properties:
                    numero: { type: string, description: "Número da NFS-e a consultar. Na consulta por faixa, é o início dela." }
                    numero_final: { type: string, description: "Fim da faixa, na consulta por faixa." }
                    serie: { type: string, description: "Série do RPS, na consulta por RPS." }
                    tipo: { type: string, description: "Tipo do RPS, na consulta por RPS." }
                    codigo_verificacao: { type: string, description: "Código de verificação da nota, na consulta por RPS." }
                    protocolo: { type: string, description: "Protocolo devolvido no envio, nas consultas de situação e de lote." }
                    numero_lote: { type: string, description: "Número do lote, nas consultas de situação e de lote." }
                    pagina: { type: integer, default: 1, description: "Página do resultado, a partir de 1. O provedor pagina consultas por número e por faixa." }
      responses:
        "200": { $ref: "#/components/responses/RespostaCrua" }
        "404": { $ref: "#/components/responses/Erro404" }

  /v1/nfse/distribuicao:
    post:
      tags: [nfse]
      summary: Distribuição DF-e do ADN por NSU
      description: |
        O cursor (`nsu`) vai e volta no payload: sem estado, é você que guarda
        onde parou. **Não paralelize a distribuição do mesmo CNPJ**, sem o lock
        que existia com banco, chamadas simultâneas embaralham o cursor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoConsultaNFSe"
                - type: object
                  properties:
                    nsu: { type: integer, description: "NSU a partir do qual buscar. 0 traz o início da fila do ADN." }
      responses:
        "200": { $ref: "#/components/responses/RespostaCrua" }

  /v1/nfse/eventos/cancelamento:
    post:
      tags: [nfse]
      summary: "Evento: cancelamento"
      description: |
        Cancela a NFS-e. Nem todo provedor implementa.

        Chamada única: a lib não expõe o XML do evento antes de enviá-lo. A
        recuperação é consultar o documento: a chave dele você já tem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoEventoNFSe"
                - type: object
                  properties:
                    evento: { $ref: "#/components/schemas/NfseEventoCancelamento" }
      responses:
        "200":
          description: Evento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEventoNFSe" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422":
          description: Evento rejeitado, ou operação não suportada pelo provedor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEventoNFSe" }
  /v1/nfse/eventos/substituicao:
    post:
      tags: [nfse]
      summary: "Evento: substituicao"
      description: |
        Emite a DPS substituta identificando a nota antiga. Nem todo provedor implementa.

        Chamada única: a lib não expõe o XML do evento antes de enviá-lo. A
        recuperação é consultar o documento: a chave dele você já tem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoEventoNFSe"
                - type: object
                  properties:
                    evento: { $ref: "#/components/schemas/NfseEventoSubstituicao" }
      responses:
        "200":
          description: Evento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEventoNFSe" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422":
          description: Evento rejeitado, ou operação não suportada pelo provedor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEventoNFSe" }
  /v1/nfse/pdf:
    post:
      tags: [nfse]
      summary: Gera o DANFSE, pela chave ou pelo XML
      description: |
        Diferente de CT-e e MDF-e, a NFS-e **recupera o PDF pela chave**
        (`ObterDANFSE`): perder o XML aqui não é definitivo. Por chave fala com
        o provedor e exige certificado; por XML é render local e não exige.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Informe `chave` (com certificado) OU `xml_b64`.
              properties:
                chave: { type: string, description: "Chave de acesso da NFS-e. Alternativa ao xml_b64: com ela o PDF é buscado no provedor." }
                xml_b64: { type: string, format: byte, description: "XML autorizado da NFS-e, em base64. Com ele o PDF sai localmente, sem falar com o provedor." }
                municipio: { type: string, description: "Código IBGE do município, que é o que decide o provedor." }
                ambiente: { $ref: "#/components/schemas/Ambiente" }
                emitente: { $ref: "#/components/schemas/Emitente" }
                certificado: { $ref: "#/components/schemas/Certificado" }
                credenciais: { $ref: "#/components/schemas/Credenciais" }
      responses:
        "200": { $ref: "#/components/responses/RespostaPDF" }
        "400": { $ref: "#/components/responses/Erro400" }

  /v1/nfse/municipios/{codigo}:
    get:
      tags: [nfse]
      summary: O município é atendido, e por quem?
      description: |
        Não leva certificado. É como você descobre, antes de montar qualquer
        coisa, se vale a pena tentar.
      parameters:
        - name: codigo
          in: path
          required: true
          description: "Código IBGE do município, com 7 dígitos."
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  codigo: { type: string, description: "Código IBGE do município consultado." }
                  provedor: { type: string, description: "Provedor que atende o município. Vazio quando não há provedor conhecido." }
                  layout: { type: string, enum: [padrao_nacional, abrasf, proprio, ""], description: "Família de layout do provedor. Vazia quando o município não tem provedor." }
                  suportado: { type: boolean, description: "true quando o município tem provedor conhecido e a emissão é possível." }

  # ---------------------------------------------------------------- boletos
  /v1/boletos/pdf:
    post:
      tags: [boletos]
      summary: Gera o PDF do(s) boleto(s)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BoletoPedido" }
      responses:
        "200": { $ref: "#/components/responses/RespostaPDF" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422": { $ref: "#/components/responses/Erro422" }

  /v1/boletos/remessa:
    post:
      tags: [boletos]
      summary: Gera o arquivo de remessa CNAB
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/BoletoPedido"
                - type: object
                  properties:
                    numeroArquivo:
                      type: integer
                      default: 1
                      description: "sequencial da remessa: controle do cliente"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  remessa: { type: string, description: "Conteúdo do arquivo de remessa CNAB, em texto." }
                  numero_arquivo: { type: integer, description: "Sequencial do arquivo de remessa, ecoado do pedido." }

  /v1/boletos/retorno:
    post:
      tags: [boletos]
      summary: Processa um arquivo de retorno CNAB
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conta, arquivo]
              properties:
                conta:
                  type: object
                  description: "só a config do banco: títulos não entram aqui"
                arquivo: { type: string, description: conteúdo cru do retorno }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  retorno:
                    description: objeto quando a lib devolve JSON; string caso contrário

  /v1/boletos/registro:
    post:
      tags: [boletos]
      summary: Registra ou baixa boleto(s) na API do banco
      description: |
        Exige `conta.ws` (OAuth + mTLS). Recusa do banco volta como `502` com o
        detalhe: a falha é do outro lado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/BoletoPedido"
                - type: object
                  properties:
                    operacao:
                      type: integer
                      enum: [0, 2]
                      default: 0
                      description: 0=incluir (exige títulos), 2=baixar
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  operacao: { type: integer, description: "Operação executada no banco: 0 = incluir, 2 = baixar." }
                  resposta: { type: string, description: "Retorno cru da API do banco, em texto. O formato varia por instituição." }
        "400": { $ref: "#/components/responses/Erro400" }
        "502": { $ref: "#/components/responses/Erro502" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: O token de `API_TOKEN`. Um token dá acesso a tudo.

  schemas:
    Ambiente:
      type: string
      description: "Ambiente do documento. Vazio assume homologação."
      enum: [homologacao, producao]
      default: homologacao

    Certificado:
      type: object
      required: [pfx_b64, senha]
      description: |
        Certificado A1 (.pfx) em base64 e a senha. **Não é persistido**: vai ao
        worker por socket unix, é usado na sessão nativa e morre com ela.
      properties:
        pfx_b64: { type: string, format: byte , description: "Certificado A1 (.pfx) em base64." }
        senha: { type: string, format: password , description: "Senha do certificado." }

    Credenciais:
      type: object
      description: |
        Login/token de prefeitura, exigidos por provedores de NFS-e fora do
        Padrão Nacional. Como o certificado, não são persistidos.
      properties:
        usuario: { type: string , description: "Usuário do webservice da prefeitura." }
        senha: { type: string, format: password , description: "Senha do webservice da prefeitura." }
        token: { type: string, format: password , description: "Token ou chave de acesso do webservice." }

    Emitente:
      type: object
      description: Sem cadastro no servidor, o emitente vem no pedido.
      required: [cnpj]
      properties:
        cnpj: { type: string , description: "CNPJ do emitente, 14 dígitos." }
        inscricao_municipal: { type: string , description: "Inscrição municipal do emitente." }
        razao_social: { type: string , description: "Razão social do emitente." }

    Validacao:
      type: object
      description: |
        `suportada: false` significa que a lib **não** expõe validação de regras
        para este documento (é o caso da NFS-e), e não que passou.
      properties:
        ok: { type: boolean , description: "Indica se o documento passou nas regras de negócio." }
        suportada: { type: boolean , description: "Indica se a validação existe para este documento. False na NFS-e, cuja biblioteca não a expõe: ali ok não é garantia." }
        mensagens:
          description: 'Rejeições encontradas, uma por linha, como a biblioteca devolveu.'
          type: array
          items: { type: string }

    RespostaXML:
      type: object
      description: "Retorno da geração: o XML montado e a chave, antes de qualquer transmissão."
      properties:
        chave: { type: string, description: chave de acesso (44 dígitos) }
        xml_b64: { type: string, format: byte , description: "O XML montado, em base64. É este que você devolve em /transmissao." }
        assinado:
          type: boolean
          description: "Sempre false. A assinatura acontece no envio, não na montagem."
        validacao: { $ref: "#/components/schemas/Validacao" }

    RespostaXMLNFSe:
      type: object
      description: "Retorno da geração da DPS: o XML e o identificador, antes de qualquer transmissão."
      properties:
        id_dps:
          type: string
          description: identificador determinístico da DPS; use em /consulta-dps
        xml_b64: { type: string, format: byte , description: "A DPS montada, em base64." }
        assinado: { type: boolean, description: "Sempre false. Na NFS-e quem assina é o provedor, no envio." }
        layout: { type: string, enum: [padrao_nacional, abrasf, proprio], description: "Família de layout resolvida pelo município." }
        provedor: { type: string, description: "Provedor de NFS-e do município. Quem o decide é o município, não o pedido." }
        validacao: { $ref: "#/components/schemas/Validacao" }

    PedidoTransmissao:
      type: object
      description: "Corpo da transmissão: o XML gerado mais o certificado."
      required: [xml_b64, certificado]
      properties:
        xml_b64:
          type: string
          format: byte
          description: o XML devolvido ao gerar
        ambiente:
          allOf: [{ $ref: "#/components/schemas/Ambiente" }]
          description: "FALLBACK: o ambiente sai do tpAmb do XML quando presente"
        certificado: { $ref: "#/components/schemas/Certificado" }

    PedidoTransmissaoNFSe:
      type: object
      description: "Corpo da transmissão da DPS. Leva município e emitente porque o servidor não guarda cadastro."
      required: [xml_b64, municipio, emitente, certificado]
      properties:
        xml_b64: { type: string, format: byte, description: "A DPS devolvida ao gerar, sem alterações." }
        municipio: { type: string, description: "código IBGE: decide o provedor "}
        ambiente: { $ref: "#/components/schemas/Ambiente" }
        emitente: { $ref: "#/components/schemas/Emitente" }
        certificado: { $ref: "#/components/schemas/Certificado" }
        credenciais: { $ref: "#/components/schemas/Credenciais" }

    Mensagem:
      type: object
      description: "Mensagem devolvida pelo fisco ou pelo provedor."
      properties:
        codigo: { type: string , description: "Código devolvido pelo fisco ou pelo provedor." }
        descricao: { type: string , description: "Texto da mensagem." }

    RespostaTransmissao:
      type: object
      description: "Retorno da transmissão, com o protocolo e o documento autorizado."
      properties:
        chave: { type: string , description: "Chave de acesso do documento." }
        protocolo: { type: string , description: "Número do protocolo de autorização." }
        status: { type: string, enum: [autorizado, rejeitado, erro] , description: "Desfecho: autorizado, rejeitado ou erro." }
        cstat: { type: string , description: "Código de status do fisco. 100 = autorizado." }
        motivo: { type: string , description: "Descrição do status devolvida pelo fisco." }
        recibo:
          type: string
          description: "vestígio: o envio é síncrono e ele não vem"
        xml_proc_b64:
          type: string
          format: byte
          description: "o documento autorizado. **Guarde**: é a sua única via."
        erros:
          description: 'Rejeições devolvidas pelo fisco.'
          type: array
          items: { $ref: "#/components/schemas/Mensagem" }

    RespostaTransmissaoNFSe:
      type: object
      description: "Retorno da transmissão da DPS, com a nota autorizada."
      properties:
        numero: { type: string , description: "Número da NFS-e atribuído pelo provedor." }
        chave: { type: string , description: "Chave de acesso da NFS-e." }
        codigo_verificacao: { type: string , description: "Código de verificação da nota, usado na consulta pública." }
        protocolo: { type: string , description: "Protocolo do provedor." }
        status: { type: string, enum: [autorizado, rejeitado, erro] , description: "Desfecho: autorizado, rejeitado ou erro." }
        situacao: { type: string , description: "Situação da nota no provedor." }
        xml_b64: { type: string, format: byte , description: "XML da NFS-e autorizada. Guarde: não há segunda via." }
        erros:
          description: 'Rejeições devolvidas pelo provedor.'
          type: array
          items: { $ref: "#/components/schemas/Mensagem" }
        alertas:
          description: 'Alertas do provedor. Não impedem a emissão.'
          type: array
          items: { $ref: "#/components/schemas/Mensagem" }

    PedidoEvento:
      type: object
      description: "Envelope do evento: identifica o documento e traz o certificado. Os campos do tipo vão em evento."
      required: [chave, certificado]
      properties:
        chave: { type: string, description: 44 dígitos }
        protocolo: { type: string, description: exigido no cancelamento }
        ambiente: { $ref: "#/components/schemas/Ambiente" }
        dhEvento: { type: string, description: "default: agora" }
        certificado: { $ref: "#/components/schemas/Certificado" }
        evento:
          type: object
          description: campos próprios do tipo; ver o modelo do documento
          additionalProperties: true

    PedidoEventoNFSe:
      type: object
      description: "Envelope do evento de NFS-e. Os campos do tipo vão em evento."
      required: [municipio, certificado]
      properties:
        chave: { type: string, description: exigida no cancelamento }
        municipio: { type: string , description: "Código IBGE do município, 7 dígitos." }
        ambiente: { $ref: "#/components/schemas/Ambiente" }
        emitente: { $ref: "#/components/schemas/Emitente" }
        certificado: { $ref: "#/components/schemas/Certificado" }
        credenciais: { $ref: "#/components/schemas/Credenciais" }
        evento:
          description: 'Campos próprios do tipo de evento.'
          type: object
          additionalProperties: true

    RespostaEvento:
      type: object
      description: "Retorno do evento, com o protocolo e o XML processado."
      properties:
        tipo: { type: string , description: "Tipo do evento enviado." }
        chave: { type: string , description: "Chave do documento." }
        status: { type: string, enum: [concluido, rejeitado, erro] , description: "Desfecho: concluido, rejeitado ou erro." }
        cstat: { type: string , description: "Código de status do fisco. 135 = evento registrado." }
        motivo: { type: string , description: "Descrição do status." }
        protocolo: { type: string , description: "Protocolo do evento." }
        xml_evento_b64: { type: string, format: byte , description: "XML do evento processado, em base64." }
        erros:
          description: 'Rejeições devolvidas pelo fisco.'
          type: array
          items: { $ref: "#/components/schemas/Mensagem" }

    RespostaEventoNFSe:
      type: object
      description: "Retorno do evento de NFS-e."
      properties:
        tipo: { type: string , description: "Tipo do evento enviado." }
        chave: { type: string , description: "Chave da nota." }
        status: { type: string , description: "Desfecho do evento." }
        protocolo: { type: string , description: "Protocolo do provedor." }
        data_hora: { type: string , description: "Data e hora do processamento." }
        xml_b64: { type: string, format: byte , description: "XML do evento, em base64." }
        mensagens:
          description: 'Mensagens do provedor.'
          type: array
          items: { $ref: "#/components/schemas/Mensagem" }

    PedidoConsultaChave:
      type: object
      description: "Consulta do documento pela chave de acesso. É o que se chama após um desfecho indeterminado."
      required: [chave, certificado]
      properties:
        chave: { type: string , description: "Chave de acesso do documento, 44 dígitos." }
        ambiente: { $ref: "#/components/schemas/Ambiente" }
        certificado: { $ref: "#/components/schemas/Certificado" }

    PedidoConsultaNFSe:
      type: object
      description: "Consulta ao provedor de NFS-e."
      required: [municipio, certificado]
      properties:
        chave: { type: string , description: "Chave da nota, ou o id_dps na consulta de DPS." }
        municipio: { type: string , description: "Código IBGE do município, 7 dígitos." }
        ambiente: { $ref: "#/components/schemas/Ambiente" }
        emitente: { $ref: "#/components/schemas/Emitente" }
        certificado: { $ref: "#/components/schemas/Certificado" }
        credenciais: { $ref: "#/components/schemas/Credenciais" }

    PedidoSefaz:
      type: object
      description: "Consulta ao webservice que não depende de chave, como status do serviço."
      required: [certificado]
      properties:
        ambiente: { $ref: "#/components/schemas/Ambiente" }
        cnpj: { type: string , description: "CNPJ do interessado, 14 dígitos." }
        certificado: { $ref: "#/components/schemas/Certificado" }

    PedidoPDF:
      type: object
      description: "XML autorizado, para gerar a representação gráfica. Não fala com o fisco, logo não pede certificado."
      required: [xml_b64]
      properties:
        xml_b64: { type: string, format: byte , description: "XML autorizado do documento, em base64." }

    # >>> INÍCIO DOS SCHEMAS GERADOS, não edite à mão (make openapi)
