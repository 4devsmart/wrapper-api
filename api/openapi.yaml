            $ref: "#/components/schemas/CteDetCont"
        tpNav:
          type: integer
          description: 'Tipo de navegação, no modal aquaviário.'
    CteAutXML:
      type: object
      description: 'CNPJ ou CPF autorizado a baixar o XML do documento.'
      properties:
        CNPJ:
          type: string
          description: 'CNPJ, 14 dígitos. Aceita com ou sem máscara.'
        CPF:
          type: string
          description: 'CPF, 11 dígitos. Aceita com ou sem máscara.'
    CteBalsa:
      type: object
      description: 'Balsa utilizada no transporte aquaviário.'
      properties:
        xBalsa:
          type: string
          description: 'Identificação da balsa.'
    CteCIBS:
      type: object
      description: 'Grupo do IBS e da CBS (Reforma Tributária).'
      properties:
        vBC:
          type: number
          description: 'Valor da base de cálculo.'
        gIBSUF:
          allOf:
            - $ref: "#/components/schemas/CteGIBSUF"
        gIBSMun:
          allOf:
            - $ref: "#/components/schemas/CteGIBSMun"
        vIBS:
          type: number
        gCBS:
          allOf:
            - $ref: "#/components/schemas/CteGCBS"
        gTribRegular:
          allOf:
            - $ref: "#/components/schemas/CteTribRegular"
        gTribCompraGov:
          allOf:
            - $ref: "#/components/schemas/CteTribCompraGov"
    CteCobr:
      type: object
      description: 'Cobrança: fatura e duplicatas.'
      properties:
        fat:
          allOf:
            - $ref: "#/components/schemas/CteFat"
        dup:
          type: array
          items:
            $ref: "#/components/schemas/CteDup"
    CteComData:
      type: object
      description: 'Entrega em data definida.'
      properties:
        tpPer:
          type: integer
          description: 'Tipo de período de entrega.'
        dProg:
          type: string
    CteComHora:
      type: object
      description: 'Entrega em hora definida.'
      properties:
        tpHor:
          type: integer
          description: 'Tipo de horário de entrega.'
        hProg:
          type: string
    CteComp:
      type: object
      description: 'Componentes que somam o valor da prestação.'
