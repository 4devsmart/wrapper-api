            $ref: "#/components/schemas/CteIdDocAntEle"
          description: 'Documentos anteriores eletrônicos, identificados pela chave.'
    CteIdDocAntEle:
      type: object
      description: 'Documento anterior eletrônico, identificado pela chave.'
      properties:
        chCTe:
          type: string
          description: 'Chave de acesso do CT-e, 44 dígitos.'
    CteIdDocAntPap:
      type: object
      description: 'Documento anterior em papel, identificado por série e número.'
      properties:
        tpDoc:
          type: string
          enum: ["00", "10", "59", "65", "99"]
          description: 'Tipo do documento. Valores: 00 = Declaração; 10 = Dutoviário; 59 = CF-e SAT; 65 = NFC-e; 99 = Outros.'
        serie:
          type: string
          description: 'Série do documento.'
        subser:
          type: string
          description: 'Subsérie do documento anterior em papel.'
        nDoc:
          type: string
          description: 'Número do documento.'
        dEmi:
          type: string
          format: date
          description: 'Data no formato AAAA-MM-DD. Também aceita DD/MM/AAAA e RFC 3339, caso em que a hora é descartada.'
    CteIde:
      type: object
      description: 'Identificação do documento: numeração, datas, tipo de emissão, municípios e modal.'
      properties:
        cUF:
          type: integer
          description: 'Código IBGE da unidade federativa, 2 dígitos.'
        cCT:
          type: string
          description: 'Código numérico aleatório que compõe a chave. A lib gera se ausente.'
        CFOP:
          type: string
          description: 'Código Fiscal de Operações e Prestações, 4 dígitos.'
        natOp:
          type: string
          description: 'Natureza da operação, em texto livre.'
        mod:
          type: integer
          enum: [57, 64, 67]
          description: 'Valores: 57 = CT-e; 64 = GTV-e; 67 = CT-e OS (Outros Serviços).'
        serie:
          type: integer
          description: 'Série do documento.'
        nCT:
          type: integer
          description: 'Número do CT-e.'
        dhEmi:
          type: string
          format: date-time
          description: 'Data e hora. COM offset (2026-08-23T14:05:00-03:00) a entrada é um instante e é convertida para o fuso do documento; SEM offset (2026-08-23T14:05:00) é lida como relógio de parede do emitente e não sofre conversão. Vazio usa o momento da chamada.'
        tpImp:
          type: integer
          enum: [1, 2]
          description: 'Valores: 1 = Retrato; 2 = Paisagem.'
        tpEmis:
          type: integer
          enum: [1, 3, 4, 7, 8]
          description: 'Valores: 1 = Normal; 3 = Regime Especial NFF; 4 = EPEC pela SVC; 7 = Autorização pela SVC-RS; 8 = Autorização pela SVC-SP.'
        cDV:
          type: integer
          description: 'Dígito verificador da chave de acesso. A lib calcula se ausente.'
        tpAmb:
          type: integer
          enum: [1, 2]
          description: 'Redundante com o campo ambiente do pedido, e mantido para quem já monta o documento completo: informado, precisa CONCORDAR com ele, senão a requisição é recusada. Quem manda no XML e na sessão é o ambiente. Valores: 1 = Produção; 2 = Homologação.'
        tpCTe:
          type: integer
          enum: [0, 1, 3]
          description: 'TpCTe não tem mais o valor 2 (Anulação): o CT-e de Anulação saiu do layout na versão 4.00, e a biblioteca fiscal só gera o grupo infCteAnu para VersaoDF <= 3.00. Quem vem da 3.00 usa o CT-e Substituto (valor 3). Valores: 0 = Normal; 1 = Complemento de valores; 3 = Substituto.'
        procEmi:
          type: integer
          enum: [0, 3, 4]
          description: 'Identificador do processo de emissão do documento. Valores: 0 = Aplicativo do contribuinte; 3 = Aplicativo fornecido pelo SEBRAE (no CT-e OS, aplicativo fornecido pelo Fisco); 4 = Provedor de Assinatura e Autorização, PAA (não vale para o CT-e OS).'
        verProc:
          type: string
          description: 'Identificação do aplicativo que gerou o documento, até 20 caracteres. Omitir assume a identificação deste serviço; informe o nome do SEU aplicativo se é ele que o fisco deve ver.'
        indGlobalizado:
          type: integer
          enum: [1]
          description: 'Indica CT-e Globalizado, sem detalhamento dos documentos. Valores: 1 = Sim. Omitir o campo equivale a não.'
        cMunEnv:
          type: string
          description: 'Código IBGE do município de envio, 7 dígitos.'
        xMunEnv:
          type: string
          description: 'Nome do município de envio.'
        UFEnv:
          type: string
          description: 'Sigla da UF de envio.'
        modal:
          type: string
          enum: ["01"]
          description: 'Valores: 01 = Rodoviário. É o único modal que este serviço emite.'
        tpServ:
          type: integer
          enum: [0, 1, 2, 6, 7, 8]
          description: 'Valores: 0 = Normal; 1 = Subcontratação; 2 = Redespacho; 6 = Transporte de pessoas (só no CT-e OS, modelo 67); 7 = Transporte de valores (só no CT-e OS, modelo 67); 8 = Excesso de bagagem (só no CT-e OS, modelo 67).'
        cMunIni:
          type: string
          description: 'Código IBGE do município de início da prestação.'
        xMunIni:
          type: string
          description: 'Nome do município de início da prestação.'
        UFIni:
          type: string
          description: 'Sigla da UF de início da prestação.'
        cMunFim:
          type: string
          description: 'Código IBGE do município de fim da prestação.'
        xMunFim:
          type: string
          description: 'Nome do município de fim da prestação.'
        UFFim:
          type: string
          description: 'Sigla da UF de fim da prestação.'
        retira:
          type: integer
          enum: [0, 1]
          description: 'Valores: 0 = Sim; 1 = Não.'
        xDetRetira:
          type: string
          description: 'Detalhes de onde a carga deve ser retirada.'
        indIEToma:
          type: integer
          enum: [1, 2, 9]
          description: 'Indicador da inscrição estadual do tomador. Valores: 1 = Contribuinte do ICMS; 2 = Contribuinte isento de inscrição; 9 = Não contribuinte.'
        toma3:
          allOf:
            - $ref: "#/components/schemas/CteToma3"
        toma4:
          allOf:
            - $ref: "#/components/schemas/CteToma4"
        dhCont:
          type: string
          description: 'Data e hora da entrada em contingência.'
        xJust:
          type: string
          description: 'Justificativa. Mínimo de 15 caracteres.'
        gCompraGov:
          allOf:
            - $ref: "#/components/schemas/CteCompraGovReduzido"
