openapi: 3.1.0
info:
  title: wrapper-api
  version: "1"
  description: |
    Gera o XML do documento fiscal a partir do seu JSON, assina, transmite à
    SEFAZ ou à prefeitura, e devolve o documento **protocolado**.

    **Nada é guardado no servidor.** Nem o XML, nem o certificado.

    | Fazemos | Não fazemos |
    |---|---|
    | traduzir seu JSON em XML fiscal e assinar | decidir o que preencher. CFOP, CST, alíquota e valores são seus |
    | transmitir e devolver o retorno protocolado | controlar numeração e série, ou impedir duplicidade |
    | enviar eventos: cancelamento, encerramento, CC-e | guardar o XML, nem o autorizado |
    | gerar DACTE, DAMDFE, DANFSE a partir do XML | guardar o certificado. Ele vai na requisição |
    | gerar boletos, remessa e retorno CNAB | fila, retry, agendamento ou histórico |

    **Roda como serviço Docker dentro da sua stack**: dois containers no seu
    compose, chamados pela sua aplicação na rede interna. Sem porta publicada,
    sem tela, sem login. Quem chama é o seu código.

    O seu sistema **guarda o XML protocolado**, o protocolo, a numeração e o
    certificado. Este serviço não guarda nada.

    A responsabilidade pelo conteúdo fiscal é de quem emite. Validamos o que a
    biblioteca fiscal valida e transmitimos o que você mandou.

    A biblioteca acompanha as **notas técnicas** do fisco e o ciclo de
    atualização de layout. Manter a versão em dia é responsabilidade de quem
    hospeda: prazo de nota técnica é obrigatório, e versão atrasada é rejeição
    na data de virada.

    Por que sem estado, e por que gerar e transmitir são separados:
    [README](https://github.com/4devsmart/wrapper-api#por-que-foi-desenhado-assim).

    Autentique com `Authorization: Bearer <API_TOKEN>`. Para experimentar aqui,
    use **Authorize** acima.

    ## Gerar e transmitir

    **1.** `POST /v1/{doc}/xml`: manda o documento em JSON, recebe o XML e a
    chave. Não assina, não fala com o fisco, **não pede certificado**.

    ```
    { documento } → { "chave": "3526…", "xml_b64": "…", "validacao": { "ok": true } }
    ```

    **2.** `POST /v1/{doc}/transmissao`: manda o XML de volta com o
    certificado. Aqui ele assina e envia.

    ```
    { "xml_b64", "certificado" } → { "protocolo", "status", "xml_proc_b64" }
    ```

    **Guarde o `xml_proc_b64`.** Não há segunda via: em CT-e e MDF-e, perder o
    XML é perder também o PDF.

    São duas chamadas porque a primeira põe a chave nas suas mãos **antes** de
    qualquer byte sair. Se a transmissão der timeout você não sabe se o
    documento foi autorizado, e é a chave que permite descobrir.

    ### ⚠️ Timeout na transmissão não autoriza repetir

    `502 desfecho_indeterminado` significa que o documento **pode** ter sido
    autorizado. Consulte pela chave (`POST /v1/cte/consulta`, ou
    `POST /v1/nfse/consulta-dps` com o `id_dps`). Repetir duplica documento
    fiscal, e a API nunca reenvia sozinha.

    ## Erros

    Formato único em toda rota: `{"erro":{"codigo","mensagem","detalhes"}}`.
    Trate por `codigo`, nunca pela mensagem.

    | Código | HTTP | Pode repetir? |
    |---|---|---|
    | `json_invalido`: corpo malformado ou **campo com nome desconhecido** | 400 | corrija |
    | `campo_obrigatorio` | 400 | corrija |
    | `certificado_invalido` | 400 | corrija |
    | `regras_de_negocio`: a biblioteca reprovou, nada foi transmitido | 422 | corrija |
    | `provedor_nao_suportado`: município sem provedor de NFS-e | 422 | não |
    | `operacao_nao_suportada`: o provedor não implementa | 422 | não |
    | `desfecho_indeterminado`: **pode ter sido transmitido** | 502 | **não.** consulte |
    | `lib_indisponivel`: a chamada **não** saiu | 503 | sim |
    | `falha_na_lib` | 502 | avalie |

    Rejeição do fisco não é erro de protocolo: volta `422` com o corpo completo
    (`status`, `cstat`, `motivo`, `erros[]`).

    Campo com nome errado é `400`, não é ignorado. Campo ignorado em silêncio vira
    documento transmitido com dado faltando, e isso só aparece depois de o fisco
    autorizar.

    ## Campos sem `required`

    Os schemas descrevem os campos e o que cada um significa, mas **não marcam
    obrigatoriedade**. No fiscal ela é condicional: depende do modal, do
    provedor do município, do tipo de emitente e do regime tributário. Nenhum
    schema estático acerta isso.

    Quem valida é a geração. `POST /v1/{doc}/xml` devolve as rejeições em
    `validacao.mensagens` antes de qualquer coisa ser transmitida.

  license:
    name: AGPL-3.0
    identifier: AGPL-3.0

servers:
  - url: /

security:
  - bearer: []

tags:
  - name: sistema
  - name: cte
  - name: mdfe
  - name: nfse
  - name: boletos

paths:
  /healthz:
    get:
      tags: [sistema]
      summary: "Liveness: o processo está vivo"
      security: []
      responses:
        "200": { $ref: "#/components/responses/StatusOK" }

  /readyz:
    get:
      tags: [sistema]
      summary: "Readiness: o motor fiscal atende"
      description: |
        Responde `503` quando não há worker atendendo. É a diferença entre "o
        processo subiu" e "dá para transmitir", sem isto o orquestrador manda
        tráfego para uma instância que só sabe errar.
      security: []
      responses:
        "200": { $ref: "#/components/responses/StatusOK" }
        "503":
          description: Sem motor fiscal
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: indisponivel }
                  motivo: { type: string }

  /openapi.yaml:
    get:
      tags: [sistema]
      summary: Esta especificação
      security: []
      responses:
        "200":
          description: OK
          content: { application/yaml: { schema: { type: string } } }

  /v1/ping:
    get:
      tags: [sistema]
      summary: Identidade do binário em execução
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  versao:
                    type: object
                    properties:
                      commit: { type: string }
                      commit_curto: { type: string }
                      build: { type: string }

  /v1/capacidades:
    get:
      tags: [sistema]
      summary: O que esta build sabe fazer, por módulo
      description: |
        É como o cliente descobre o contrato sem tentar a rota e tomar `404`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  base: { type: string, example: /v1 }
                  modulos:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string }

  # ---------------------------------------------------------------- CT-e
  /v1/cte/xml:
    post:
      tags: [cte]
      summary: Gera o XML do CT-e
      description: |
        Sem certificado e sem rede. Devolve o XML e a **chave**, que é o que
        permite recuperar uma transmissão perdida.

        `422 regras_de_negocio` quando a validação da lib reprova: o XML vai
        junto na resposta, para você ver o que a lib entendeu.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CteDocumento" }
      responses:
        "200":
          description: XML montado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaXML" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422": { $ref: "#/components/responses/Erro422" }
        "502": { $ref: "#/components/responses/Erro502" }
        "503": { $ref: "#/components/responses/Erro503" }

  /v1/cte/simp/xml:
    post:
      tags: [cte]
      summary: Gera o XML do CT-e Simplificado (tpCTe=5)
      description: |
        Não há rota de transmissão própria: transmitir é a mesma operação, e o
        XML já diz o que é. Use `POST /v1/cte/transmissao`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CteDocumentoSimplificado" }
      responses:
        "200":
          description: XML montado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaXML" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422": { $ref: "#/components/responses/Erro422" }

  /v1/cte/transmissao:
    post:
      tags: [cte]
      summary: Transmite o CT-e ao fisco
      description: |
        O ambiente sai do `tpAmb` do próprio XML; o campo `ambiente` só é usado
        se a tag faltar. Divergir seria rejeição 252, ou um documento de
        homologação indo para produção.

        **Timeout aqui não é falha: é desfecho desconhecido.** A resposta `502
        desfecho_indeterminado` significa que o documento PODE ter sido
        autorizado. Não repita: use `POST /v1/cte/consulta`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoTransmissao" }
      responses:
        "200":
          description: Autorizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaTransmissao" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422":
          description: Rejeitado pelo fisco (o corpo traz cStat e motivo)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaTransmissao" }
        "502": { $ref: "#/components/responses/Erro502" }
        "503": { $ref: "#/components/responses/Erro503" }

  /v1/cte/eventos/cancelamento:
    post:
      tags: [cte]
      summary: "Evento: cancelamento"
      description: |
        Cancela o CT-e. Exige o protocolo da autorização.

        Chamada única: a lib não expõe o XML do evento antes de enviá-lo. A
        recuperação é consultar o documento: a chave dele você já tem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoEvento"
                - type: object
                  properties:
                    evento: { $ref: "#/components/schemas/CteEventoCancelamento" }
      responses:
        "200":
          description: Evento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422":
          description: Evento rejeitado, ou operação não suportada pelo provedor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
  /v1/cte/eventos/carta-correcao:
    post:
      tags: [cte]
      summary: "Evento: carta-correcao"
      description: |
        Carta de Correção (CC-e). Um grupo por campo corrigido.

        Chamada única: a lib não expõe o XML do evento antes de enviá-lo. A
        recuperação é consultar o documento: a chave dele você já tem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoEvento"
                - type: object
                  properties:
                    evento: { $ref: "#/components/schemas/CteEventoCartaCorrecao" }
      responses:
        "200":
          description: Evento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422":
          description: Evento rejeitado, ou operação não suportada pelo provedor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
  /v1/cte/eventos/epec:
    post:
      tags: [cte]
      summary: "Evento: epec"
      description: |
        Evento Prévio de Emissão em Contingência.

        Chamada única: a lib não expõe o XML do evento antes de enviá-lo. A
        recuperação é consultar o documento: a chave dele você já tem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoEvento"
                - type: object
                  properties:
                    evento: { $ref: "#/components/schemas/CteEventoEPEC" }
      responses:
        "200":
          description: Evento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422":
          description: Evento rejeitado, ou operação não suportada pelo provedor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
  /v1/cte/eventos/comprovante-entrega:
    post:
      tags: [cte]
      summary: "Evento: comprovante-entrega"
      description: |
        Registra a entrega da carga, com as NF-e entregues.

        Chamada única: a lib não expõe o XML do evento antes de enviá-lo. A
        recuperação é consultar o documento: a chave dele você já tem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoEvento"
                - type: object
                  properties:
                    evento: { $ref: "#/components/schemas/CteEventoComprovanteEntrega" }
      responses:
        "200":
          description: Evento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422":
          description: Evento rejeitado, ou operação não suportada pelo provedor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
  /v1/cte/eventos/insucesso-entrega:
    post:
      tags: [cte]
      summary: "Evento: insucesso-entrega"
      description: |
        Registra tentativa frustrada de entrega.

        Chamada única: a lib não expõe o XML do evento antes de enviá-lo. A
        recuperação é consultar o documento: a chave dele você já tem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoEvento"
                - type: object
                  properties:
                    evento: { $ref: "#/components/schemas/CteEventoInsucessoEntrega" }
      responses:
        "200":
          description: Evento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422":
          description: Evento rejeitado, ou operação não suportada pelo provedor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
  /v1/cte/eventos/prestacao-desacordo:
    post:
      tags: [cte]
      summary: "Evento: prestacao-desacordo"
      description: |
        Registrado pelo TOMADOR quando a prestação está em desacordo.

        Chamada única: a lib não expõe o XML do evento antes de enviá-lo. A
        recuperação é consultar o documento: a chave dele você já tem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoEvento"
                - type: object
                  properties:
                    evento: { $ref: "#/components/schemas/CteEventoPrestacaoDesacordo" }
      responses:
        "200":
          description: Evento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422":
          description: Evento rejeitado, ou operação não suportada pelo provedor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
  /v1/cte/consulta:
    post:
      tags: [cte]
      summary: Consulta o CT-e pela chave
      description: |
        É a recuperação depois de um desfecho indeterminado. Chame ISTO, nunca
        repita a transmissão.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoConsultaChave" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaTransmissao" }
        "400": { $ref: "#/components/responses/Erro400" }

  /v1/cte/status-servico:
    post:
      tags: [cte]
      summary: Status do serviço da SEFAZ
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoSefaz" }
      responses:
        "200": { $ref: "#/components/responses/RespostaCrua" }

  /v1/cte/cadastro:
    post:
      tags: [cte]
      summary: Consulta o cadastro de um contribuinte na UF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoSefaz"
                - type: object
                  required: [uf, documento]
                  properties:
                    uf: { type: string, example: SP }
                    documento: { type: string, description: CNPJ/CPF, ou IE quando eh_ie=true }
                    eh_ie: { type: boolean, default: false }
      responses:
        "200": { $ref: "#/components/responses/RespostaCrua" }
        "400": { $ref: "#/components/responses/Erro400" }

  /v1/cte/pdf:
    post:
      tags: [cte]
      summary: Gera o DACTE a partir do XML
      description: |
        **Não existe "obter PDF pela chave" no CT-e.** Se você perder o XML, o
        DACTE não se regenera de lugar nenhum. Render local: não fala com a
        SEFAZ, logo não pede certificado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoPDF" }
      responses:
        "200": { $ref: "#/components/responses/RespostaPDF" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422": { $ref: "#/components/responses/Erro422" }

  /v1/cte/pdf/evento:
    post:
      tags: [cte]
      summary: Gera o DACTE de um evento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoPDF"
                - type: object
                  required: [xml_evento_b64]
                  properties:
                    xml_evento_b64: { type: string, format: byte }
      responses:
        "200": { $ref: "#/components/responses/RespostaPDF" }
        "400": { $ref: "#/components/responses/Erro400" }

  # ---------------------------------------------------------------- MDF-e
  /v1/mdfe/xml:
    post:
      tags: [mdfe]
      summary: Gera o XML do MDF-e
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MdfeDocumento" }
      responses:
        "200":
          description: XML montado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaXML" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422": { $ref: "#/components/responses/Erro422" }

  /v1/mdfe/transmissao:
    post:
      tags: [mdfe]
      summary: Transmite o MDF-e ao fisco
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoTransmissao" }
      responses:
        "200":
          description: Autorizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaTransmissao" }
        "422":
          description: Rejeitado pelo fisco
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaTransmissao" }
        "502": { $ref: "#/components/responses/Erro502" }

  /v1/mdfe/eventos/encerramento:
    post:
      tags: [mdfe]
      summary: "Evento: encerramento"
      description: |
        Encerra o manifesto. Exige o município de encerramento.

        Chamada única: a lib não expõe o XML do evento antes de enviá-lo. A
        recuperação é consultar o documento: a chave dele você já tem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoEvento"
                - type: object
                  properties:
                    evento: { $ref: "#/components/schemas/MdfeEventoEncerramento" }
      responses:
        "200":
          description: Evento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422":
          description: Evento rejeitado, ou operação não suportada pelo provedor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
  /v1/mdfe/eventos/cancelamento:
    post:
      tags: [mdfe]
      summary: "Evento: cancelamento"
      description: |
        Cancela o MDF-e. Exige o protocolo da autorização.

        Chamada única: a lib não expõe o XML do evento antes de enviá-lo. A
        recuperação é consultar o documento: a chave dele você já tem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoEvento"
                - type: object
                  properties:
                    evento: { $ref: "#/components/schemas/MdfeEventoCancelamento" }
      responses:
        "200":
          description: Evento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422":
          description: Evento rejeitado, ou operação não suportada pelo provedor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
  /v1/mdfe/eventos/inclusao-condutor:
    post:
      tags: [mdfe]
      summary: "Evento: inclusao-condutor"
      description: |
        Inclui condutor no manifesto em trânsito.

        Chamada única: a lib não expõe o XML do evento antes de enviá-lo. A
        recuperação é consultar o documento: a chave dele você já tem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoEvento"
                - type: object
                  properties:
                    evento: { $ref: "#/components/schemas/MdfeEventoInclusaoCondutor" }
      responses:
        "200":
          description: Evento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422":
          description: Evento rejeitado, ou operação não suportada pelo provedor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
  /v1/mdfe/eventos/inclusao-dfe:
    post:
      tags: [mdfe]
      summary: "Evento: inclusao-dfe"
      description: |
        Inclui documentos (NF-e) no manifesto em trânsito.

        Chamada única: a lib não expõe o XML do evento antes de enviá-lo. A
        recuperação é consultar o documento: a chave dele você já tem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoEvento"
                - type: object
                  properties:
                    evento: { $ref: "#/components/schemas/MdfeEventoInclusaoDFe" }
      responses:
        "200":
          description: Evento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422":
          description: Evento rejeitado, ou operação não suportada pelo provedor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
  /v1/mdfe/eventos/pagamento-operacao:
    post:
      tags: [mdfe]
      summary: "Evento: pagamento-operacao"
      description: |
        Registra o pagamento da operação de transporte.

        Chamada única: a lib não expõe o XML do evento antes de enviá-lo. A
        recuperação é consultar o documento: a chave dele você já tem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoEvento"
                - type: object
                  properties:
                    evento: { $ref: "#/components/schemas/MdfeEventoPagamentoOperacao" }
      responses:
        "200":
          description: Evento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422":
          description: Evento rejeitado, ou operação não suportada pelo provedor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEvento" }
  /v1/mdfe/consulta:
    post:
      tags: [mdfe]
      summary: Consulta o MDF-e pela chave
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoConsultaChave" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaTransmissao" }

  /v1/mdfe/status-servico:
    post:
      tags: [mdfe]
      summary: Status do serviço da SEFAZ
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoSefaz" }
      responses:
        "200": { $ref: "#/components/responses/RespostaCrua" }

  /v1/mdfe/nao-encerrados:
    post:
      tags: [mdfe]
      summary: Lista os MDF-e do CNPJ ainda em trânsito
      description: |
        Conformidade: emitir novo manifesto com outro em aberto é rejeição.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoSefaz"
                - type: object
                  required: [cnpj]
      responses:
        "200": { $ref: "#/components/responses/RespostaCrua" }
        "400": { $ref: "#/components/responses/Erro400" }

  /v1/mdfe/pdf:
    post:
      tags: [mdfe]
      summary: Gera o DAMDFE a partir do XML
      description: |
        Como no CT-e, **não existe "obter PDF pela chave"**. Guarde o XML.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoPDF" }
      responses:
        "200": { $ref: "#/components/responses/RespostaPDF" }

  /v1/mdfe/pdf/evento:
    post:
      tags: [mdfe]
      summary: Gera o DAMDFE de um evento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoPDF"
                - type: object
                  required: [xml_evento_b64]
                  properties:
                    xml_evento_b64: { type: string, format: byte }
      responses:
        "200": { $ref: "#/components/responses/RespostaPDF" }

  # ---------------------------------------------------------------- NFS-e
  /v1/nfse/xml:
    post:
      tags: [nfse]
      summary: Gera o XML da DPS
      description: |
        O município (`infDPS.cLocEmi`, ou o do prestador) decide o provedor, e o
        provedor decide o layout. Município sem provedor conhecido é recusado
        **antes** de montar.

        Devolve `id_dps`, não `chave`: a chave de acesso só existe depois da
        autorização, enquanto o identificador da DPS é determinístico. É ele que
        recupera a transmissão perdida.

        `validacao.suportada` vem **false**: o ACBrNFSeX não expõe validação de
        regras de negócio, ao contrário de CT-e e MDF-e.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NfseDocumento" }
      responses:
        "200":
          description: DPS montada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaXMLNFSe" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422": { $ref: "#/components/responses/Erro422" }

  /v1/nfse/transmissao:
    post:
      tags: [nfse]
      summary: Transmite a DPS ao provedor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoTransmissaoNFSe" }
      responses:
        "200":
          description: Autorizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaTransmissaoNFSe" }
        "422":
          description: Rejeitada, ou operação não suportada pelo provedor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaTransmissaoNFSe" }
        "502": { $ref: "#/components/responses/Erro502" }

  /v1/nfse/consulta-dps:
    post:
      tags: [nfse]
      summary: A DPS virou nota? (recuperação)
      description: |
        É o fecho do modelo sem estado para a NFS-e: depois de um desfecho
        indeterminado, é ISTO que se chama: nunca reenviar a DPS.

        Aceita o `id_dps` como a geração devolveu (com o prefixo `DPS`) ou a
        chave nua; o webservice quer sem prefixo, e essa diferença não é
        problema seu.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoConsultaNFSe" }
      responses:
        "200": { $ref: "#/components/responses/RespostaCrua" }
        "400": { $ref: "#/components/responses/Erro400" }

  /v1/nfse/consulta:
    post:
      tags: [nfse]
      summary: Consulta a NFS-e pela chave
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoConsultaNFSe" }
      responses:
        "200": { $ref: "#/components/responses/RespostaCrua" }

  /v1/nfse/consultas/{tipo}:
    post:
      tags: [nfse]
      summary: Consultas por número, faixa, RPS, situação ou lote
      parameters:
        - name: tipo
          in: path
          required: true
          schema: { type: string, enum: [numero, faixa, rps, situacao, lote-rps] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoConsultaNFSe"
                - type: object
                  properties:
                    numero: { type: string }
                    numero_final: { type: string }
                    serie: { type: string }
                    tipo: { type: string }
                    codigo_verificacao: { type: string }
                    protocolo: { type: string }
                    numero_lote: { type: string }
                    pagina: { type: integer, default: 1 }
      responses:
        "200": { $ref: "#/components/responses/RespostaCrua" }
        "404": { $ref: "#/components/responses/Erro404" }

  /v1/nfse/distribuicao:
    post:
      tags: [nfse]
      summary: Distribuição DF-e do ADN por NSU
      description: |
        O cursor (`nsu`) vai e volta no payload: sem estado, é você que guarda
        onde parou. **Não paralelize a distribuição do mesmo CNPJ**, sem o lock
        que existia com banco, chamadas simultâneas embaralham o cursor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoConsultaNFSe"
                - type: object
                  properties:
                    nsu: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/RespostaCrua" }

  /v1/nfse/eventos/cancelamento:
    post:
      tags: [nfse]
      summary: "Evento: cancelamento"
      description: |
        Cancela a NFS-e. Nem todo provedor implementa.

        Chamada única: a lib não expõe o XML do evento antes de enviá-lo. A
        recuperação é consultar o documento: a chave dele você já tem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoEventoNFSe"
                - type: object
                  properties:
                    evento: { $ref: "#/components/schemas/NfseEventoCancelamento" }
      responses:
        "200":
          description: Evento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEventoNFSe" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422":
          description: Evento rejeitado, ou operação não suportada pelo provedor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEventoNFSe" }
  /v1/nfse/eventos/substituicao:
    post:
      tags: [nfse]
      summary: "Evento: substituicao"
      description: |
        Emite a DPS substituta identificando a nota antiga. Nem todo provedor implementa.

        Chamada única: a lib não expõe o XML do evento antes de enviá-lo. A
        recuperação é consultar o documento: a chave dele você já tem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PedidoEventoNFSe"
                - type: object
                  properties:
                    evento: { $ref: "#/components/schemas/NfseEventoSubstituicao" }
      responses:
        "200":
          description: Evento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEventoNFSe" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422":
          description: Evento rejeitado, ou operação não suportada pelo provedor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespostaEventoNFSe" }
  /v1/nfse/pdf:
    post:
      tags: [nfse]
      summary: Gera o DANFSE, pela chave ou pelo XML
      description: |
        Diferente de CT-e e MDF-e, a NFS-e **recupera o PDF pela chave**
        (`ObterDANFSE`): perder o XML aqui não é definitivo. Por chave fala com
        o provedor e exige certificado; por XML é render local e não exige.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Informe `chave` (com certificado) OU `xml_b64`.
              properties:
                chave: { type: string }
                xml_b64: { type: string, format: byte }
                municipio: { type: string }
                ambiente: { $ref: "#/components/schemas/Ambiente" }
                emitente: { $ref: "#/components/schemas/Emitente" }
                certificado: { $ref: "#/components/schemas/Certificado" }
                credenciais: { $ref: "#/components/schemas/Credenciais" }
      responses:
        "200": { $ref: "#/components/responses/RespostaPDF" }
        "400": { $ref: "#/components/responses/Erro400" }

  /v1/nfse/municipios/{codigo}:
    get:
      tags: [nfse]
      summary: O município é atendido, e por quem?
      description: |
        Não leva certificado. É como você descobre, antes de montar qualquer
        coisa, se vale a pena tentar.
      parameters:
        - name: codigo
          in: path
          required: true
          schema: { type: string, description: código IBGE de 7 dígitos }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  codigo: { type: string }
                  provedor: { type: string }
                  layout: { type: string, enum: [padrao_nacional, abrasf, proprio, ""] }
                  suportado: { type: boolean }

  # ---------------------------------------------------------------- boletos
  /v1/boletos/pdf:
    post:
      tags: [boletos]
      summary: Gera o PDF do(s) boleto(s)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BoletoPedido" }
      responses:
        "200": { $ref: "#/components/responses/RespostaPDF" }
        "400": { $ref: "#/components/responses/Erro400" }
        "422": { $ref: "#/components/responses/Erro422" }

  /v1/boletos/remessa:
    post:
      tags: [boletos]
      summary: Gera o arquivo de remessa CNAB
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/BoletoPedido"
                - type: object
                  properties:
                    numeroArquivo:
                      type: integer
                      default: 1
                      description: "sequencial da remessa: controle do cliente"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  remessa: { type: string }
                  numero_arquivo: { type: integer }

  /v1/boletos/retorno:
    post:
      tags: [boletos]
      summary: Processa um arquivo de retorno CNAB
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conta, arquivo]
              properties:
                conta:
                  type: object
                  description: "só a config do banco: títulos não entram aqui"
                arquivo: { type: string, description: conteúdo cru do retorno }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  retorno:
                    description: objeto quando a lib devolve JSON; string caso contrário

  /v1/boletos/registro:
    post:
      tags: [boletos]
      summary: Registra ou baixa boleto(s) na API do banco
      description: |
        Exige `conta.ws` (OAuth + mTLS). Recusa do banco volta como `502` com o
        detalhe: a falha é do outro lado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/BoletoPedido"
                - type: object
                  properties:
                    operacao:
                      type: integer
                      enum: [0, 2]
                      default: 0
                      description: 0=incluir (exige títulos), 2=baixar
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  operacao: { type: integer }
                  resposta: { type: string }
        "400": { $ref: "#/components/responses/Erro400" }
        "502": { $ref: "#/components/responses/Erro502" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: O token de `API_TOKEN`. Um token dá acesso a tudo.

  schemas:
    Ambiente:
      type: string
      enum: [homologacao, producao]
      default: homologacao

    Certificado:
      type: object
      required: [pfx_b64, senha]
      description: |
        Certificado A1 (.pfx) em base64 e a senha. **Não é persistido**: vai ao
        worker por socket unix, é usado na sessão nativa e morre com ela.
      properties:
        pfx_b64: { type: string, format: byte }
        senha: { type: string, format: password }

    Credenciais:
      type: object
      description: |
        Login/token de prefeitura, exigidos por provedores de NFS-e fora do
        Padrão Nacional. Como o certificado, não são persistidos.
      properties:
        usuario: { type: string }
        senha: { type: string, format: password }
        token: { type: string, format: password }

    Emitente:
      type: object
      description: Sem cadastro no servidor, o emitente vem no pedido.
      required: [cnpj]
      properties:
        cnpj: { type: string }
        inscricao_municipal: { type: string }
        razao_social: { type: string }

    Validacao:
      type: object
      description: |
        `suportada: false` significa que a lib **não** expõe validação de regras
        para este documento (é o caso da NFS-e), e não que passou.
      properties:
        ok: { type: boolean }
        suportada: { type: boolean }
        mensagens:
          type: array
          items: { type: string }

    RespostaXML:
      type: object
      properties:
        chave: { type: string, description: chave de acesso (44 dígitos) }
        xml_b64: { type: string, format: byte }
        assinado:
          type: boolean
          description: "sempre `false`: a ACBrLib assina no envio, não na montagem"
        validacao: { $ref: "#/components/schemas/Validacao" }

    RespostaXMLNFSe:
      type: object
      properties:
        id_dps:
          type: string
          description: identificador determinístico da DPS; use em /consulta-dps
        xml_b64: { type: string, format: byte }
        assinado: { type: boolean }
        layout: { type: string, enum: [padrao_nacional, abrasf, proprio] }
        provedor: { type: string }
        validacao: { $ref: "#/components/schemas/Validacao" }

    PedidoTransmissao:
      type: object
      required: [xml_b64, certificado]
      properties:
        xml_b64:
          type: string
          format: byte
          description: o XML devolvido ao gerar
        ambiente:
          allOf: [{ $ref: "#/components/schemas/Ambiente" }]
          description: "FALLBACK: o ambiente sai do tpAmb do XML quando presente"
        certificado: { $ref: "#/components/schemas/Certificado" }

    PedidoTransmissaoNFSe:
      type: object
      required: [xml_b64, municipio, emitente, certificado]
      properties:
        xml_b64: { type: string, format: byte }
        municipio: { type: string, description: "código IBGE: decide o provedor "}
        ambiente: { $ref: "#/components/schemas/Ambiente" }
        emitente: { $ref: "#/components/schemas/Emitente" }
        certificado: { $ref: "#/components/schemas/Certificado" }
        credenciais: { $ref: "#/components/schemas/Credenciais" }

    Mensagem:
      type: object
      properties:
        codigo: { type: string }
        descricao: { type: string }

    RespostaTransmissao:
      type: object
      properties:
        chave: { type: string }
        protocolo: { type: string }
        status: { type: string, enum: [autorizado, rejeitado, erro] }
        cstat: { type: string }
        motivo: { type: string }
        recibo:
          type: string
          description: "vestígio: o envio é síncrono e ele não vem"
        xml_proc_b64:
          type: string
          format: byte
          description: "o documento autorizado. **Guarde**: é a sua única via."
        erros:
          type: array
          items: { $ref: "#/components/schemas/Mensagem" }

    RespostaTransmissaoNFSe:
      type: object
      properties:
        numero: { type: string }
        chave: { type: string }
        codigo_verificacao: { type: string }
        protocolo: { type: string }
        status: { type: string, enum: [autorizado, rejeitado, erro] }
        situacao: { type: string }
        xml_b64: { type: string, format: byte }
        erros:
          type: array
          items: { $ref: "#/components/schemas/Mensagem" }
        alertas:
          type: array
          items: { $ref: "#/components/schemas/Mensagem" }

    PedidoEvento:
      type: object
      required: [chave, certificado]
      properties:
        chave: { type: string, description: 44 dígitos }
        protocolo: { type: string, description: exigido no cancelamento }
        ambiente: { $ref: "#/components/schemas/Ambiente" }
        dhEvento: { type: string, description: "default: agora" }
        certificado: { $ref: "#/components/schemas/Certificado" }
        evento:
          type: object
          description: campos próprios do tipo; ver o modelo do documento
          additionalProperties: true

    PedidoEventoNFSe:
      type: object
      required: [municipio, certificado]
      properties:
        chave: { type: string, description: exigida no cancelamento }
        municipio: { type: string }
        ambiente: { $ref: "#/components/schemas/Ambiente" }
        emitente: { $ref: "#/components/schemas/Emitente" }
        certificado: { $ref: "#/components/schemas/Certificado" }
        credenciais: { $ref: "#/components/schemas/Credenciais" }
        evento:
          type: object
          additionalProperties: true

    RespostaEvento:
      type: object
      properties:
        tipo: { type: string }
        chave: { type: string }
        status: { type: string, enum: [concluido, rejeitado, erro] }
        cstat: { type: string }
        motivo: { type: string }
        protocolo: { type: string }
        xml_evento_b64: { type: string, format: byte }
        erros:
          type: array
          items: { $ref: "#/components/schemas/Mensagem" }

    RespostaEventoNFSe:
      type: object
      properties:
        tipo: { type: string }
        chave: { type: string }
        status: { type: string }
        protocolo: { type: string }
        data_hora: { type: string }
        xml_b64: { type: string, format: byte }
        mensagens:
          type: array
          items: { $ref: "#/components/schemas/Mensagem" }

    PedidoConsultaChave:
      type: object
      required: [chave, certificado]
      properties:
        chave: { type: string }
        ambiente: { $ref: "#/components/schemas/Ambiente" }
        certificado: { $ref: "#/components/schemas/Certificado" }

    PedidoConsultaNFSe:
      type: object
      required: [municipio, certificado]
      properties:
        chave: { type: string }
        municipio: { type: string }
        ambiente: { $ref: "#/components/schemas/Ambiente" }
        emitente: { $ref: "#/components/schemas/Emitente" }
        certificado: { $ref: "#/components/schemas/Certificado" }
        credenciais: { $ref: "#/components/schemas/Credenciais" }

    PedidoSefaz:
      type: object
      required: [certificado]
      properties:
        ambiente: { $ref: "#/components/schemas/Ambiente" }
        cnpj: { type: string }
        certificado: { $ref: "#/components/schemas/Certificado" }

    PedidoPDF:
      type: object
      required: [xml_b64]
      properties:
        xml_b64: { type: string, format: byte }

    PedidoBoleto:
      type: object
      required: [conta, titulos]
      description: |
        Conta de cobrança (banco + cedente) e títulos. Ver
        `internal/boleto/model.go`. `conta.ws` carrega OAuth e mTLS quando o
        registro é online, não é persistido.
      additionalProperties: true
      properties:
        conta: { type: object, additionalProperties: true }
        titulos:
          type: array
          items: { type: object, additionalProperties: true }
    # >>> INÍCIO DOS SCHEMAS GERADOS, não edite à mão (make openapi)
    BoletoConta:
      type: object
      description: 'Conta é a configuração da conta de cobrança ([Banco]+[Conta]+[Cedente]).'
      properties:
        banco:
          type: string
          description: 'Banco ([Banco]): número (ex.: "237") + tipo de cobrança (enum ACBr) + CNAB.'
        tipoCobranca:
          type: integer
