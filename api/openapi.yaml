          type: integer
          description: 'Código IBGE da unidade federativa, 2 dígitos.'
        tpAmb:
          type: integer
          enum: [1, 2]
          description: 'Redundante com o campo ambiente do pedido, e mantido para quem já monta o documento completo: informado, precisa CONCORDAR com ele, senão a requisição é recusada. Quem manda no XML e na sessão é o ambiente. Valores: 1 = Produção; 2 = Homologação.'
        tpEmit:
          type: integer
          enum: [1, 2, 3]
          description: 'Valores: 1 = Prestador de serviço de transporte; 2 = Transporte de carga própria; 3 = Prestador de serviço de transporte, CT-e Globalizado.'
        tpTransp:
          type: integer
          enum: [1, 2, 3]
          description: 'Valores: 1 = ETC (Empresa de Transporte Rodoviário de Cargas); 2 = TAC (Transportador Autônomo de Cargas); 3 = CTC (Cooperativa de Transporte de Cargas).'
        mod:
          type: integer
          enum: [58]
          description: 'Valores: 58 = MDF-e.'
        serie:
          type: integer
          description: 'Série do documento.'
        nMDF:
          type: integer
          description: 'Número do MDF-e.'
        cMDF:
          type: string
          description: 'Código numérico aleatório que compõe a chave. A lib gera se ausente.'
        cDV:
          type: integer
          description: 'Dígito verificador da chave de acesso. A lib calcula se ausente.'
        modal:
          type: integer
          enum: [1]
          description: 'Valores: 1 = Rodoviário. É o único modal que este serviço emite.'
        dhEmi:
          type: string
          format: date-time
          description: 'Data e hora. COM offset (2026-08-23T14:05:00-03:00) a entrada é um instante e é convertida para o fuso do documento; SEM offset (2026-08-23T14:05:00) é lida como relógio de parede do emitente e não sofre conversão. Vazio usa o momento da chamada.'
        tpEmis:
          type: integer
          enum: [1, 2, 3]
          description: 'Valores: 1 = Normal; 2 = Contingência; 3 = Regime Especial NFF.'
        procEmi:
          type: string
          enum: ["0", "4"]
          description: 'Identificador do processo de emissão do documento. Valores: 0 = Aplicativo do contribuinte; 4 = Provedor de Assinatura e Autorização (PAA).'
        verProc:
          type: string
          description: 'Identificação do aplicativo que gerou o documento, até 20 caracteres. Omitir assume a identificação deste serviço; informe o nome do SEU aplicativo se é ele que o fisco deve ver.'
        UFIni:
          type: string
          description: 'Sigla da UF de início da prestação.'
        UFFim:
          type: string
          description: 'Sigla da UF de fim da prestação.'
        infMunCarrega:
          type: array
          items:
            $ref: "#/components/schemas/MdfeInfMunCarrega"
          description: 'Municípios de carregamento da carga.'
        infPercurso:
          type: array
          items:
            $ref: "#/components/schemas/MdfeInfPercurso"
          description: 'UFs de percurso entre a origem e o destino.'
        dhIniViagem:
          type: string
          format: date-time
          description: 'Data e hora. COM offset (2026-08-23T14:05:00-03:00) a entrada é um instante e é convertida para o fuso do documento; SEM offset (2026-08-23T14:05:00) é lida como relógio de parede do emitente e não sofre conversão. Vazio usa o momento da chamada.'
        indCanalVerde:
          type: integer
          enum: [1]
          description: 'Indica adesão ao Canal Verde Brasil. Valores: 1 = Sim. Omitir o campo equivale a não.'
        indCarregaPosterior:
          type: integer
          enum: [1]
          description: 'Indica que o carregamento pode ocorrer após a emissão. Valores: 1 = Sim. Omitir o campo equivale a não.'
