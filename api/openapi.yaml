          description: 'identifica a NFS-e antiga.'
          allOf:
            - $ref: "#/components/schemas/NfseNFSeSubstituidaRef"
        codigo:
          type: string
          description: 'CodCancelamento, default "1".'
        motivo:
          type: string
          description: 'Descrição do status devolvido pelo fisco.'
