name: Publicar imagem

# Builda a imagem a cada push em main e só a publica como :<sha> e :latest depois
# de fumaça, integração e conferência das libs. Até lá ela existe só como
# :teste-<sha>, que ninguém consome. Assim, :<sha> existir quer dizer que ela
# passou, e é isso que o release confere antes de promover.
# NÃO implanta nada: quem promove para :vX.Y.Z é o workflow de release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Em fila, nunca em paralelo: dois merges seguidos disputariam o :latest, e o mais
# lento venceria mesmo sendo o commit mais velho.
concurrency:
  group: publicar
  cancel-in-progress: false

env:
  IMAGEM: ghcr.io/${{ github.repository }}/api
  IMAGEM_TESTE: ghcr.io/${{ github.repository }}/api:teste-${{ github.sha }}

jobs:
  publicar:
    # O disparo manual é para repetir a publicação da main. Em outra branch, ele
    # escreveria no :latest uma imagem que não passou pela revisão.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A imagem precisa dos .so, que não estão no repositório: vêm dos anexos de
      # release. Como o repositório é público, o download é sem token.
      - name: baixa as libs nativas
        run: make acbr-libs-baixar

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64 # a ACBrLib só existe para x86_64
          push: true
          tags: ${{ env.IMAGEM_TESTE }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_BUILD=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prova que a imagem sobe e que a lib nativa carrega de verdade, antes de
      # alguém puxá-la. Uma imagem que publica e não sobe é pior que build falho.
      - name: "fumaça: a lib carrega e o serviço responde"
        run: |
          set -eu
          # Nomes de container precisam de 2+ caracteres: o daemon recusa "w" e
          # "a" com "Invalid container name". Não encurte.
          docker network create fumaca
          # Volume NOMEADO, como no compose. Bind mount de diretório do host não
          # serve: ele nasce do root, e a imagem roda como app (uid 10001), então
          # o worker leva "permission denied" ao criar o socket. Um volume nomeado
          # herda a dona do /run/wrapper da imagem.
          docker volume create fumaca-run
          docker run -d --name fumaca-worker --network fumaca \
            -v fumaca-run:/run/wrapper "${IMAGEM_TESTE}" worker
          docker run -d --name fumaca-api --network fumaca -p 8080:8080 \
            -e API_TOKEN=fumaca -e ACBR_WORKERS=/run/wrapper/fiscal.sock \
            -v fumaca-run:/run/wrapper "${IMAGEM_TESTE}"
          # A espera é pelo /readyz, NÃO pelo /healthz. O healthz responde assim
          # que a API abre a porta e não toca no worker, então esperar por ele é
          # esperar por nada: quem depende da lib nativa ter carregado e do
          # socket existir é o readyz. Com a espera no healthz, o readyz era
          # consultado 0,25s depois de subir e devolvia 503 num runner frio.
          pronto=0
          for _ in $(seq 1 60); do
            if curl -fsS localhost:8080/readyz >/dev/null 2>&1; then pronto=1; break; fi
            sleep 2
          done
          if [ "$pronto" != 1 ]; then
            echo "::error::/readyz não ficou pronto em 120s"
            docker logs fumaca-worker || true
            docker logs fumaca-api || true
            exit 1
          fi
          curl -fsS localhost:8080/healthz
          curl -fsS localhost:8080/readyz
          # backend "cgo" nos quatro serviços = a lib nativa realmente carregou.
          docker logs fumaca-worker 2>&1 | grep -c '"backend":"cgo"' | grep -q '^4$' \
            || { echo "::error::a lib nativa não carregou nos 4 serviços"; docker logs fumaca-worker; exit 1; }
          echo "fumaça OK"

      # A fumaça só prova que a lib carrega. Isto gera o XML de um município por
      # combinação de provedor, versão e API própria contra a lib da imagem e cobra
      # o layout que a tabela informa. Não transmite nada. A discordância entre a
      # tabela e a lib já mandou DPS com valores de ABRASF para Brasília.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"

      - name: "integração: raiz do XML por provedor, contra a imagem"
        env:
          WRAPPER_API_URL: http://127.0.0.1:8080
          WRAPPER_API_TOKEN: fumaca
        run: make test-integracao-nfse

      # A fumaça prova que a lib carrega, não qual lib é. A v1.3.0 subiu e passou
      # na fumaça com a lib de NFS-e sem os patches que o próprio release trazia.
      - name: as libs da imagem são as do release
        run: scripts/conferir-libs-imagem.sh "${IMAGEM_TESTE}" acbr-libs

      # Último passo de propósito. Copia o manifesto, então o digest é o da imagem
      # que acabou de ser conferida.
      - name: "promove :teste-<sha> → :<sha> e :latest"
        run: docker buildx imagetools create -t "${IMAGEM}:${GITHUB_SHA}" -t "${IMAGEM}:latest" "${IMAGEM_TESTE}"
