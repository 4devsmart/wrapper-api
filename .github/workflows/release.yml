name: Release

# Entrega: promove a imagem JÁ TESTADA da release para as tags de distribuição.
# NÃO rebuilda: re-aponta as tags para o MESMO digest que passou pelo publicar.yml,
# ou seja, exatamente os bits que foram verificados.
#
#   1. make release → release/vX.Y.Z: o publicar.yml publica :<sha> se tudo passar
#   2. make ship    → a main anda para o commit da release, se o passo 1 passou
#   3. este workflow → :<sha> vira :vX.Y.Z, :vX, :stable e :latest, e sai a página
#
# Nada dispara pela tag: o `make release` a cria antes de a imagem existir.
on:
  push:
    branches: [main]

permissions:
  # write, e não read, porque este workflow cria a página do Release. É a única
  # elevação aqui: ele não empurra código nem move branch.
  contents: write
  packages: write

env:
  IMAGEM: ghcr.io/${{ github.repository }}/api

jobs:
  promover:
    runs-on: ubuntu-latest
    steps:
      # Precisa do histórico e das tags para montar as notas a partir dos
      # commits desde a versão anterior.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A main só anda por `make ship`, mas o primeiro push dela depois de adotar o
      # fluxo, e qualquer exceção, não é entrega: aí não há nada a promover.
      - name: é uma entrega?
        id: versao
        run: |
          set -eu
          VERSAO="v$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
          ASSUNTO="$(git log -1 --format=%s)"
          if [ "$ASSUNTO" = "chore(release): $VERSAO" ]; then
            echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"
            echo "entrega=sim" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::'$ASSUNTO' não é commit de release: nada a promover."
            echo "entrega=nao" >> "$GITHUB_OUTPUT"
          fi

      # Sem registro no changelog, nada é promovido.
      - name: a versão está no changelog
        if: steps.versao.outputs.entrega == 'sim'
        run: scripts/changelog-da-versao.sh "$VERSAO" >/dev/null

      - uses: docker/login-action@v3
        if: steps.versao.outputs.entrega == 'sim'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :<sha> só existe se o publicar.yml passou. As libs são conferidas de novo
      # porque aquela conferência foi contra as libs do commit, e esta é contra as
      # do release.
      - name: baixa as libs do release
        if: steps.versao.outputs.entrega == 'sim'
        run: make acbr-libs-baixar

      - name: as libs da imagem são as do release
        if: steps.versao.outputs.entrega == 'sim'
        run: scripts/conferir-libs-imagem.sh "${IMAGEM}:${GITHUB_SHA}" acbr-libs

      - name: promove :<sha> → :vX.Y.Z (+ :stable e :latest)
        if: steps.versao.outputs.entrega == 'sim'
        run: |
          set -eu
          ORIGEM="${IMAGEM}:${GITHUB_SHA}"

          if ! docker buildx imagetools inspect "$ORIGEM" >/dev/null 2>&1; then
            echo "::error::$ORIGEM não existe no registry: o commit não é de main ou a publicação dele não passou."
            exit 1
          fi

          TAGS="-t ${IMAGEM}:${VERSAO}"
          # A tag maior (:v1) é a que o compose do README usa: ela acompanha
          # correção e recurso dentro da major, e para de andar na virada, que é
          # onde há quebra. Sem ela o exemplo do README aponta para uma tag que não
          # existe.
          MAIOR="${VERSAO%%.*}"
          # Só a versão mais alta move as tags que andam: um hotfix numa linha
          # antiga publica a própria tag, sem levar :stable e :v1 para trás.
          mais_alta() { git tag -l "$1" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1; }
          if [ "$(mais_alta "${MAIOR}.*")" = "$VERSAO" ]; then TAGS="$TAGS -t ${IMAGEM}:${MAIOR}"; fi
          if [ "$(mais_alta 'v*')" = "$VERSAO" ]; then TAGS="$TAGS -t ${IMAGEM}:stable -t ${IMAGEM}:latest"; fi

          # imagetools create copia o manifesto (mesmo digest) para as tags novas.
          docker buildx imagetools create $TAGS "$ORIGEM"
          docker buildx imagetools inspect "${IMAGEM}:${VERSAO}"
          echo "tags publicadas: $(echo "$TAGS" | tr ' ' '\n' | grep -v '^-t$' | tr '\n' ' ')"

          # Conferir, não presumir: cada tag nova tem de estar no digest de origem.
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
          DIGEST="$(digest "$ORIGEM")"
          for t in $(echo "$TAGS" | tr ' ' '\n' | grep -v '^-t$'); do
            d="$(digest "$t")"
            if [ "$d" != "$DIGEST" ]; then
              echo "::error::$t está em $d, a origem $ORIGEM está em $DIGEST"
              exit 1
            fi
          done
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"

      # Promover a imagem sem criar a página deixa a aba de Releases atrás das
      # tags, e quem abre o repositório vê como "Latest" o que estiver lá, que
      # já foi um pacote de binários de biblioteca.
      - name: "publica a página do Release"
        if: steps.versao.outputs.entrega == 'sim'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          # Os binários da ACBrLib são anexos de UM release por revisão do ACBr,
          # não de todo release: 56 MB em cada versão, inclusive nas que só
          # mexem em documentação, não se justifica. O preço disso é que a
          # página da versão pode não ter anexo nenhum, e quem procura os .so
          # não descobre onde estão. Estas duas linhas resolvem isso, lendo do
          # Makefile da própria tag. Vazio em tag anterior a ACBR_LIBS_RELEASE,
          # e aí a linha não sai.
          LIBS_REL="$(sed -n 's/^ACBR_LIBS_RELEASE[[:space:]]*?*=[[:space:]]*//p' Makefile | head -1)"
          ACBR_R="$(sed -n 's/^ACBR_REV[[:space:]]*?*=[[:space:]]*//p' Makefile | head -1)"

          # Conferir antes de afirmar. A linha abaixo diz ao leitor onde estão os
          # .so, e o ci.yml e o publicar.yml só descobririam um release vazio no
          # próximo push, depois da página já publicada com a promessa errada.
          if [ -n "$LIBS_REL" ] && [ "$LIBS_REL" != "$VERSAO" ]; then
            FALTA=""
            TEM="$(gh release view "$LIBS_REL" --repo "$GITHUB_REPOSITORY" \
                     --json assets --jq '.assets[].name' 2>/dev/null || true)"
            for a in libacbrnfse64.so libacbrcte64.so libacbrmdfe64.so \
                     libacbrnfe64.so libacbrboleto64.so schemas.tar.gz \
                     SHA256SUMS revisao.txt; do
              printf '%s\n' "$TEM" | grep -qxF "$a" || FALTA="$FALTA $a"
            done
            if [ -n "$FALTA" ]; then
              echo "::error::ACBR_LIBS_RELEASE aponta para $LIBS_REL, que não tem:$FALTA"
              echo "::error::Publique com 'make acbr-libs-publicar' ou corrija ACBR_LIBS_RELEASE."
              exit 1
            fi
            echo "anexos da ACBrLib conferidos em $LIBS_REL"
          fi

          NFSE_SHA="$(awk '$2 ~ /libacbrnfse64\.so$/ {print $1}' acbr-libs/SHA256SUMS)"

          {
            # O changelog abre a página: é onde está o que exige ação de quem atualiza.
            scripts/changelog-da-versao.sh "$VERSAO"
            printf '\n---\n\n'
            printf 'Imagem: `%s:%s`\n\n' "$IMAGEM" "$VERSAO"
            # O digest não muda quando alguém move uma tag. É ele que se fixa no
            # deploy: image: ...@sha256:...
            printf 'Digest: `%s@%s`\n\n' "$IMAGEM" "$DIGEST"
            printf 'Lib de NFS-e na imagem: `libacbrnfse64.so` sha256 `%s`, conferida contra o `SHA256SUMS` do release das libs.\n\n' "$NFSE_SHA"
            if [ -n "$LIBS_REL" ]; then
              if [ "$LIBS_REL" = "$VERSAO" ]; then
                printf 'Binários da ACBrLib (revisão r%s): anexos deste release.\n\n' "$ACBR_R"
              else
                printf 'Binários da ACBrLib (revisão r%s): anexos do release [%s](../releases/tag/%s). ' "$ACBR_R" "$LIBS_REL" "$LIBS_REL"
                printf 'O `make acbr-libs-baixar` os busca de lá.\n\n' 
              fi
            fi
            printf '\n\nComo subir, escopo e o que conferir antes de apontar para produção:\n'
            printf '[README](../blob/%s/README.md) e [docs/LIMITACOES.md](../blob/%s/docs/LIMITACOES.md).\n' "$VERSAO" "$VERSAO"
          } > /tmp/notas.md


          # Idempotente: reexecutar o workflow atualiza as notas em vez de falhar.
          if gh release view "$VERSAO" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$VERSAO" --repo "$GITHUB_REPOSITORY" \
              --notes-file /tmp/notas.md
          else
            gh release create "$VERSAO" --repo "$GITHUB_REPOSITORY" \
              --title "$VERSAO" --notes-file /tmp/notas.md --verify-tag
          fi
          echo "página: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${VERSAO}"
