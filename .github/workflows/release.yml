name: Release

# Promove a imagem JÁ TESTADA de um commit de main para as tags de distribuição.
# NÃO rebuilda: re-aponta as tags para o MESMO digest que passou pelo CI e pelo
# teste de fumaça, ou seja, exatamente os bits que foram verificados.
#
#   1. merge em main   → Publicar imagem publica :<sha> e :latest
#   2. validado        → git tag v1.2.3 && git push origin v1.2.3
#   3. este workflow   → promove :<sha> para :v1.2.3 (+ :stable)
#
# Pré-release (tag com hífen, ex. v1.2.3-rc1) não move :stable.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  # write, e não read, porque este workflow cria a página do Release. É a única
  # elevação aqui: ele não empurra código nem move branch.
  contents: write
  packages: write

env:
  IMAGEM: ghcr.io/${{ github.repository }}/api

jobs:
  promover:
    runs-on: ubuntu-latest
    steps:
      # Precisa do histórico e das tags para montar as notas a partir dos
      # commits desde a versão anterior.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: promove :<sha> → :vX.Y.Z (+ :stable)
        run: |
          set -eu
          VERSAO="${GITHUB_REF_NAME}"
          ORIGEM="${IMAGEM}:${GITHUB_SHA}"

          if ! docker buildx imagetools inspect "$ORIGEM" >/dev/null 2>&1; then
            echo "::error::$ORIGEM não existe no registry. Faça a tag num commit de main já publicado."
            exit 1
          fi

          TAGS="-t ${IMAGEM}:${VERSAO}"
          case "$VERSAO" in
            *-*) echo "Pré-release ($VERSAO): não move :stable nem a tag maior." ;;
            *)
              # A tag maior (:v1) é a que o compose do README usa: ela acompanha
              # correção e recurso dentro da major, e para de andar na virada,
              # que é onde há quebra. Sem ela o exemplo do README aponta para
              # uma tag que não existe.
              MAIOR="${VERSAO%%.*}"
              TAGS="$TAGS -t ${IMAGEM}:stable -t ${IMAGEM}:${MAIOR}"
              ;;
          esac

          # imagetools create copia o manifesto (mesmo digest) para as tags novas.
          docker buildx imagetools create $TAGS "$ORIGEM"
          docker buildx imagetools inspect "${IMAGEM}:${VERSAO}"
          echo "tags publicadas: $(echo "$TAGS" | tr ' ' '\n' | grep -v '^-t$' | tr '\n' ' ')"

      # Promover a imagem sem criar a página deixa a aba de Releases atrás das
      # tags, e quem abre o repositório vê como "Latest" o que estiver lá, que
      # já foi um pacote de binários de biblioteca.
      - name: "publica a página do Release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          VERSAO="${GITHUB_REF_NAME}"
          ANTERIOR="$(git describe --tags --abbrev=0 --match 'v*' "${VERSAO}^" 2>/dev/null || true)"

          {
            printf 'Imagem: `%s:%s`' "$IMAGEM" "$VERSAO"
            case "$VERSAO" in
              *-*) printf ' (pré-release: não move `:stable` nem a tag maior)\n' ;;
              *)   printf ', que é o mesmo digest de `:%s` e `:stable`.\n' "${VERSAO%%.*}" ;;
            esac
            printf '\n'
            if [ -n "$ANTERIOR" ]; then
              printf '## Mudanças desde %s\n\n' "$ANTERIOR"
              git log --no-merges --pretty='- %s' "${ANTERIOR}..${VERSAO}"
            else
              printf '## Primeira versão\n\nHistórico completo em `git log`.\n'
            fi
            printf '\n\nComo subir, escopo e o que conferir antes de apontar para produção:\n'
            printf '[README](../blob/%s/README.md) e [docs/LIMITACOES.md](../blob/%s/docs/LIMITACOES.md).\n' "$VERSAO" "$VERSAO"
          } > /tmp/notas.md

          PRE=""
          case "$VERSAO" in *-*) PRE="--prerelease --latest=false" ;; esac

          # Idempotente: reexecutar o workflow atualiza as notas em vez de falhar.
          if gh release view "$VERSAO" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$VERSAO" --repo "$GITHUB_REPOSITORY" \
              --notes-file /tmp/notas.md $PRE
          else
            gh release create "$VERSAO" --repo "$GITHUB_REPOSITORY" \
              --title "$VERSAO" --notes-file /tmp/notas.md --verify-tag $PRE
          fi
          echo "página: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${VERSAO}"
