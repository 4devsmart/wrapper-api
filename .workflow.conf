# Configuracao do fluxo git deste projeto. Lido por scripts/flow-lib.sh.
# So o que difere do padrao precisa estar aqui.

STACK=go

# O gate que `make finish`, `make release` e o pre-push rodam.
GATE_CMD="make ci"

# 1 = o pre-push roda o gate para toda arvore enviada que nunca passou nele
# (branch publicada antes do finish, commit feito a mao em develop).
PREPUSH_GATE=1

# 1 = o pre-commit formata os arquivos staged (pint no PHP, gofmt no Go).
FORMAT_ON_COMMIT=1

# Tamanho maximo do assunto do commit.
SUBJECT_MAX=100

# 1 = recusa trailer Co-Authored-By de assistente (Claude, Copilot...).
REFUSE_AI_COAUTHOR=1

# Workflow do GitHub Actions disparado pelo push em main, que `make ship`
# acompanha ate o fim. Vazio = o ship so move main.
DEPLOY_WORKFLOW="release.yml"

# Workflow que constroi a imagem no push de release/vX.Y.Z (`make release`),
# para o deploy so baixar a imagem pronta. O `make ship` so move main depois
# que ele terminou bem. Vazio = a imagem e construida no deploy, e o ship nao confere.
RELEASE_BUILD_WORKFLOW="publicar.yml"

# Os nomes das branches, se o projeto usar outros.
# MAIN_BRANCH=main
# DEVELOP_BRANCH=develop
